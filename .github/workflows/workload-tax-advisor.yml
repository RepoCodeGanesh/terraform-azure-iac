# ==============================================================================
# Workflow: Workload - TaxBot India Infrastructure IaC (Uses Reusable Templates)
# Provisions: Azure AI Landing Zone for TaxBot India
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: Workload - TaxBot India IaC

on:
  push:
    branches: [main, develop]
    paths:
      - 'workloads/tax-advisor/**'
      - '.github/workflows/workload-tax-advisor.yml'
      - '.github/workflows/templates/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'workloads/tax-advisor/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/templates/tf-plan.yml
    with:
      working_directory: 'workloads/tax-advisor'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      client_id: ${{ secrets.APP_CLIENT_ID }}
      environment_name: 'tax-advisor-prod'
      artifact_name: 'tax-advisor-tfplan'
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/templates/tf-apply.yml
    with:
      working_directory: 'workloads/tax-advisor'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      client_id: ${{ secrets.APP_CLIENT_ID }}
      environment_name: 'tax-advisor-prod'
      artifact_name: 'tax-advisor-tfplan'
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
