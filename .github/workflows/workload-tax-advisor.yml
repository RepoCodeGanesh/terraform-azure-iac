# ==============================================================================
# Workflow: Workload - TaxBot India Infrastructure IaC (Uses Central Organization Templates)
# Provisions: Azure AI Landing Zone for TaxBot India
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# Central Template Repo: RepoCodeGanesh/.github
# ==============================================================================

name: Workload - TaxBot India IaC

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'workloads/tax-advisor/**'
      - '.github/workflows/workload-tax-advisor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'workloads/tax-advisor/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: RepoCodeGanesh/.github/.github/workflows/tf-plan.yml@main
    with:
      working_directory: 'workloads/tax-advisor'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'tax-advisor-prod'
      artifact_name: 'tax-advisor-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/tf-apply.yml@main
    with:
      working_directory: 'workloads/tax-advisor'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'tax-advisor-prod'
      artifact_name: 'tax-advisor-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
