# ==============================================================================
# Workflow: Workload - TaxBot India Infrastructure IaC (True Level 3 Golden Path)
# Provisions: Azure AI Landing Zone for TaxBot India
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Workload - TaxBot India IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'workloads/tax-advisor/**'
      - '.github/workflows/workload-tax-advisor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'workloads/tax-advisor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  tax-advisor-iac:
    name: 🧾 TaxBot Infrastructure IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'workloads/tax-advisor'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'tax-advisor-prod'
      artifact_name: 'tax-advisor-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
