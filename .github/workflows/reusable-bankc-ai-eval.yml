# ==============================================================================
# Reusable Workflow: BankCompliance AI — GenAIOps Quality Gate
# Called by: app-bank-compliance.yml  (uses: ./.github/workflows/reusable-bankc-ai-eval.yml)
# Purpose:   Runs Ragas Triad regression evaluation against golden dataset
#            and uploads scorecard & cost attestation artifacts.
# ==============================================================================

name: Reusable - BankCompliance AI Eval Gate

on:
  workflow_call:
    inputs:
      skip_eval:
        description: 'Set true to skip evaluation (e.g. frontend-only dispatch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ai-eval-quality-gate:
    name: AI Quality & Regression Gate
    if: ${{ !inputs.skip_eval }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GenAIOps Regression & Cost Evaluation
        run: |
          python app/bank-compliance/eval/evaluate.py --mode fast --max-cost 0.05

      - name: Upload GenAIOps Scorecard & FinOps Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genaiops-evaluation-attestation
          path: |
            app/bank-compliance/eval/eval_results.json
            app/bank-compliance/eval/eval_cost_summary.json
            app/bank-compliance/eval/eval_attestation.json
          retention-days: 30
