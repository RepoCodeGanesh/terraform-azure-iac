# ==============================================================================
# Workflow: PR Title Conventional Commits Check (Standalone Workflow)
# Enforces SemVer-compatible PR title syntax (e.g. feat:, fix:, docs:, chore:)
# Ensures github-tag-action computes accurate version bumps upon merge
# ==============================================================================

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Syntax
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
