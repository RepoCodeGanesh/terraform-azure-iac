# ==============================================================================
# Workflow: Platform - Governance & Policy-as-Code (True Level 3 Golden Path)
# Provisions: Management Groups Tree, Enterprise Baseline Policy Set & Assignments
# Target Scope: Root Management Group (HappieTechies-root-MG)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Platform - Governance & Policy-as-Code

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/governance/**'
      - '.github/workflows/platform-governance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/governance/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  governance-iac:
    name: 📜 Governance & Policy IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'platform/governance'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'governance-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
