# ==============================================================================
# Workflow: Universal Terraform Manager (Plan, Apply, Destroy)
# Description: Single unified interface to select any workload or platform root
#              and trigger Plan, Apply, or Destroy with safety validation.
# ==============================================================================

name: "Terraform - Universal Manager (Plan / Apply / Destroy)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select Platform Tier or Workload:'
        required: true
        type: choice
        options:
          - 'workloads/bank-compliance-ai-aks'
          - 'workloads/tax-advisor'
          - 'platform/shared-services'
          - 'platform/hub'
          - 'platform/bootstrap'
      action:
        description: 'Select Terraform Action:'
        required: true
        type: choice
        options:
          - 'plan'
          - 'apply'
          - 'destroy'
      confirm_destroy:
        description: 'If destroying, type "DESTROY" to confirm (leave empty for plan/apply):'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  execute-terraform:
    name: Terraform ${{ inputs.action }} on ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Destroy Confirmation
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error ::Action is 'destroy' but confirm_destroy was not set to 'DESTROY'. Aborting."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Target Azure Configuration
        id: resolve
        run: |
          TARGET="${{ inputs.target }}"
          echo "Selected Target: $TARGET"
          echo "Selected Action: ${{ inputs.action }}"

          case "$TARGET" in
            "workloads/bank-compliance-ai-aks")
              echo "sub_id=f4ffefe1-d689-4059-969c-ccc73e2a11d4" >> $GITHUB_OUTPUT
              echo "client_id=${{ secrets.APP_CLIENT_ID }}" >> $GITHUB_OUTPUT
              ;;
            "workloads/tax-advisor")
              echo "sub_id=f4ffefe1-d689-4059-969c-ccc73e2a11d4" >> $GITHUB_OUTPUT
              echo "client_id=${{ secrets.APP_CLIENT_ID }}" >> $GITHUB_OUTPUT
              ;;
            "platform/shared-services")
              echo "sub_id=859a785c-bd38-402d-b595-1f44f40fb9bf" >> $GITHUB_OUTPUT
              echo "client_id=${{ secrets.SHARED_CLIENT_ID }}" >> $GITHUB_OUTPUT
              ;;
            "platform/hub")
              echo "sub_id=3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b" >> $GITHUB_OUTPUT
              echo "client_id=${{ secrets.HUB_CLIENT_ID }}" >> $GITHUB_OUTPUT
              ;;
            "platform/bootstrap")
              echo "sub_id=7689ad81-71ba-481b-a17c-e1b6be61bab1" >> $GITHUB_OUTPUT
              echo "client_id=${{ secrets.BOOTSTRAP_CLIENT_ID }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error ::Unknown target $TARGET"
              exit 1
              ;;
          esac

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ steps.resolve.outputs.client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.resolve.outputs.sub_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        working-directory: ${{ inputs.target }}
        run: |
          terraform init -backend-config=backend.hcl -input=false

      - name: Terraform Plan
        if: inputs.action == 'plan'
        working-directory: ${{ inputs.target }}
        run: |
          if [ -f "prod.tfvars" ]; then
            terraform plan -var-file=prod.tfvars
          else
            terraform plan
          fi

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ inputs.target }}
        run: |
          if [ -f "prod.tfvars" ]; then
            terraform apply -auto-approve -var-file=prod.tfvars
          else
            terraform apply -auto-approve
          fi

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ inputs.target }}
        run: |
          if [ -f "prod.tfvars" ]; then
            terraform destroy -auto-approve -var-file=prod.tfvars
          else
            terraform destroy -auto-approve
          fi
