# ==============================================================================
# Reusable Workflow: BankCompliance AI — Backend Build & AKS Deploy
# Called by: app-bank-compliance.yml  (uses: ./.github/workflows/reusable-bankc-backend.yml)
# Purpose:
#   JOB A — Multi-stage Docker build → GHCR + Trivy container scan
#   JOB B — Helm upgrade → AKS (aks-ht-bankc-p-cin-01) + E2E smoke test
# ==============================================================================

name: Reusable - BankCompliance Backend Build & AKS Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA to tag the container image with'
        required: true
        type: string
      deploy:
        description: 'Set true to deploy to AKS after build (false = build+push only)'
        required: false
        default: true
        type: boolean
    secrets:
      APP_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

permissions:
  contents: read
  packages: write        # Push to GHCR
  security-events: write # Trivy SARIF → GitHub Code Scanning
  actions: read          # codeql-action/upload-sarif
  id-token: write        # Azure OIDC login for AKS deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-compliance-backend
  AKS_CLUSTER_NAME: aks-ht-bankc-p-cin-01
  AKS_RESOURCE_GROUP: rg-ht-bankc-p-cin-01
  SUBSCRIPTION_ID: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

jobs:
  # ── JOB A: Build & Push Backend Container to GHCR ───────────────────────────
  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_sha_tag: ${{ steps.prep_tag.outputs.image_sha_tag }}
      image_tag: ${{ steps.prep_tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: prep_tag
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT
          echo "image_sha_tag=${IMAGE_LOWER}:${{ inputs.sha }}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: app/bank-compliance/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep_tag.outputs.image_tag }}
            ${{ steps.prep_tag.outputs.image_sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy Container Image Security Scan (SARIF → GitHub Code Scanning) ──
      # exit-code '0' = non-blocking (observational). Upload always runs so
      # Security → Code Scanning Alerts is populated even on clean builds.
      - name: 🔒 Trivy Container Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.prep_tag.outputs.image_sha_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-bankc-backend'

  # ── JOB B: Deploy Kubernetes Manifests + Helm to AKS ───────────────────────
  deploy-backend-aks:
    name: Deploy to AKS
    needs: [build-and-push-backend]
    if: |
      inputs.deploy == true &&
      needs.build-and-push-backend.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push'))
    runs-on: ubuntu-latest
    environment: bank-compliance-prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy BankCompliance AI via Helm
        run: |
          OPENAI_ENDPOINT=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-endpoint --query value -o tsv)
          OPENAI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-api-key --query value -o tsv)
          GEMINI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name gemini-api-key --query value -o tsv)
          GROQ_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name groq-api-key --query value -o tsv 2>/dev/null || echo "")

          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # ── Resolve Workload Identity Client ID from live Azure resource ────────
          # This is the ONLY value that changes on every Terraform destroy+apply
          # because the UAMI gets a new object ID each time. Fetching live from
          # Azure prevents any manual intervention after infra recreate.
          UAMI_CLIENT_ID=$(az identity show \
            --name uami-ht-bankc-p-cin-01 \
            --resource-group rg-ht-bankc-p-cin-01 \
            --query clientId -o tsv)

          if [ -z "$UAMI_CLIENT_ID" ]; then
            echo "❌ ERROR: Could not resolve UAMI client ID — UAMI may not exist yet. Run Terraform apply first."
            exit 1
          fi

          echo "✅ Resolved UAMI Client ID: ${UAMI_CLIENT_ID}"

          kubectl create namespace bank-compliance --dry-run=client -o yaml | kubectl apply -f -

          # FinOps & Compute Right-Sizing: Deploy Tuned Ingress-NGINX (1m CPU)
          kubectl apply -f ./app/bank-compliance/k8s/nginx/ingress-nginx.yaml

          # FinOps & Single-Node Optimizer: Pin System Add-ons to 1 Replica
          if [ -f "./app/bank-compliance/k8s/finops-single-node-tuner.yaml" ]; then
            echo "⚡ Applying FinOps Single-Node Tuner..."
            kubectl apply -f ./app/bank-compliance/k8s/finops-single-node-tuner.yaml
          fi

          # Wait for Ingress-NGINX LoadBalancer IP to be assigned before Helm
          echo "⏳ Waiting for Ingress-NGINX LoadBalancer IP..."
          for i in $(seq 1 24); do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$INGRESS_IP" ]; then
              echo "✅ Ingress-NGINX is ready at IP: $INGRESS_IP"
              break
            fi
            echo "  Attempt $i/24 — waiting 10s..."
            sleep 10
          done

          # ── Auto-recover from stuck Helm release (caused by killed CI jobs) ────────
          # Query DIRECTLY by status label — reliable on all kubectl versions.
          # Negative jsonpath indexing (.items[-1]) is NOT supported universally.
          # This patches ALL stuck secrets in case multiple accumulated.
          for STUCK_STATUS in pending-upgrade pending-install pending-rollback; do
            STUCK_SECRETS=$(kubectl get secret -n bank-compliance \
              -l "owner=helm,name=bank-compliance,status=${STUCK_STATUS}" \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
            if [ -n "$STUCK_SECRETS" ]; then
              echo "⚠️  Stuck Helm release(s) detected [${STUCK_STATUS}]: $STUCK_SECRETS"
              for SECRET in $STUCK_SECRETS; do
                kubectl label secret "$SECRET" -n bank-compliance status=failed --overwrite
                echo "  ✅ Patched: $SECRET → failed"
              done
            fi
          done

          # ── Enforce 1-Replica FinOps Quota on System Addons (Free up ~400m CPU) ───
          echo "⚡ Optimizing system addon replicas for single-node cluster (FinOps quota)..."
          kubectl scale deployment keda-admission-webhooks -n kube-system --replicas=1 2>/dev/null || true
          kubectl scale deployment keda-operator-metrics-apiserver -n kube-system --replicas=1 2>/dev/null || true
          kubectl scale deployment metrics-server -n kube-system --replicas=1 2>/dev/null || true
          kubectl scale deployment konnectivity-agent-autoscaler -n kube-system --replicas=1 2>/dev/null || true
          kubectl scale deployment coredns-autoscaler -n kube-system --replicas=1 2>/dev/null || true

          echo "Current Helm secrets:"
          kubectl get secret -n bank-compliance -l "owner=helm,name=bank-compliance" \
            -o custom-columns="NAME:.metadata.name,STATUS:.metadata.labels.status" \
            --sort-by=.metadata.creationTimestamp 2>/dev/null || true

          helm upgrade --install bank-compliance ./app/bank-compliance/chart \
            --namespace bank-compliance \
            --set backend.image.repository="${IMAGE_LOWER}" \
            --set backend.image.tag="${{ inputs.sha }}" \
            --set secrets.openaiEndpoint="$OPENAI_ENDPOINT" \
            --set secrets.openaiKey="$OPENAI_KEY" \
            --set secrets.geminiApiKey="$GEMINI_KEY" \
            --set secrets.groqApiKey="$GROQ_KEY" \
            --set serviceAccount.clientId="$UAMI_CLIENT_ID" \
            --wait \
            --timeout 10m

          # ── A2 & A3: Deploy FastMCP Server & Private SLM Inference Pods ─────
          if [ -d "./app/bank-compliance/k8s/inference" ]; then
            echo "🤖 Deploying FastMCP Regulatory Search Tool & Private SLM..."
            kubectl apply -f ./app/bank-compliance/k8s/inference/ -n bank-compliance
          fi

      - name: Collect AKS Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== Pods in bank-compliance ==="
          kubectl get pods -n bank-compliance -o wide
          echo "=== Services in bank-compliance ==="
          kubectl get svc -n bank-compliance
          echo "=== Pod Events & Description ==="
          kubectl describe pods -n bank-compliance
          echo "=== Backend Logs ==="
          kubectl logs -n bank-compliance -l app=bankc-backend --tail=100 || true
          echo "=== LiteLLM Logs ==="
          kubectl logs -n bank-compliance -l app=litellm-proxy --tail=100 || true

      # ── E2E Smoke Test: Validates entire chain is working post-deploy ──
      # Why: Catches silent failures (model deprecation, APIM mis-routing, cold
      #      start errors) that don't fail the Helm deploy but break the live UI.
      - name: 🔥 E2E Smoke Test — AI Compliance Query (APIM → NGINX → Gemini)
        run: |
          echo "⏳ Waiting 20s for pods to stabilize after Helm rollout..."
          sleep 20

          echo "🚀 Sending live compliance query through APIM gateway..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://apim-ht-ss-p-cin-01.azure-api.net/bankc/api/v1/compliance/query" \
            -H "Content-Type: application/json" \
            -d '{"query": "What are the RBI data localization rules for banking transaction records?"}' \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SMOKE TEST FAILED: APIM returned HTTP $HTTP_CODE"
            echo "Response body: $BODY"
            exit 1
          fi

          # Validate the response is a real AI answer, not an abstention/empty
          MODEL_USED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('model_used',''))")
          CITATION_COUNT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('citations',[])))")

          echo "Model used: $MODEL_USED"
          echo "Citations returned: $CITATION_COUNT"

          if echo "$MODEL_USED" | grep -q "abstention"; then
            echo "❌ SMOKE TEST FAILED: Response was an out-of-scope abstention — AI model may be misconfigured"
            echo "Full response: $BODY"
            exit 1
          fi

          if [ "$CITATION_COUNT" -lt 1 ]; then
            echo "❌ SMOKE TEST FAILED: No citations returned — Qdrant or retrieval pipeline is broken"
            echo "Full response: $BODY"
            exit 1
          fi

          echo "✅ SMOKE TEST PASSED: model=$MODEL_USED citations=$CITATION_COUNT"

      - name: Generate AKS Production Release Step Summary
        if: always()
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF >> $GITHUB_STEP_SUMMARY

          ### 🚀 BankCompliance AI — Production Deployment Summary
          **Release Status:** ✅ \`Successfully Deployed to AKS\`
          **Target Environment:** \`bank-compliance-prod\` (Apps-prod Subscription)

          | Resource | Value / Configuration | Status |
          | :--- | :--- | :--- |
          | **Live Domain** | [https://bank.mytaxbot.site](https://bank.mytaxbot.site) | 🟢 Active |
          | **AKS Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` (\`bank-compliance\` namespace) | 🟢 Ready |
          | **Backend Container** | \`${IMAGE_LOWER}:${{ inputs.sha }}\` | 🟢 Running |
          | **AI Gateway (LiteLLM)** | Azure OpenAI ➔ Google Gemini Fallback Chain | 🟢 Healthy |
          | **Vector Database (Qdrant)** | 4GB CSI Azure Managed Disk | 🟢 Connected |
          | **FinOps Autoscaler** | KEDA Scale-to-Zero (0 to 5 Pods) | 🟢 Enabled (\$0 Idle) |
          | **Observability** | Azure Container Insights + Log Analytics (law-ht-ss-p-cin-01) | 🟢 Streaming |

          EOF
