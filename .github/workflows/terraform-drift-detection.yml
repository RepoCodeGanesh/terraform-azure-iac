# ==============================================================================
# Workflow: Automated Multi-Root Terraform Drift Detection & Email Alerting
# Monorepo: HappyTechies Enterprise Azure Landing Zone
# Target Email: ganesank@mytaxbot.site
# Schedule: Daily at 02:00 UTC (07:30 IST) + On-Demand Manual Trigger
# ==============================================================================

name: 'Terraform Drift Detection'

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_root:
        description: 'Terraform Root to Scan (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'platform/bootstrap'
          - 'platform/hub'
          - 'platform/shared-services'
          - 'workloads/tax-advisor'
          - 'workloads/bank-compliance-ai-aks'

permissions:
  id-token: write
  contents: read
  issues: write

env:
  NOTIFICATION_EMAIL: 'ganesank@mytaxbot.site'
  AZURE_TENANT_ID: '4cef0d84-84d6-4ed0-8abe-773b015bcf99'

jobs:
  # ─── STAGE 1: Dynamically Resolve Target Roots Based on Trigger/Input ───────
  resolve-targets:
    name: Resolve Target Roots
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ github.event.inputs.target_root || 'all' }}"
          EVENT="${{ github.event_name }}"

          ALL_TARGETS='[{"name":"Platform - Bootstrap","root":"platform/bootstrap","client_id":"934ab83b-2f61-475e-bdbc-85c9eaed83e6","sub_id":"7689ad81-71ba-481b-a17c-e1b6be61bab1"},{"name":"Platform - Hub Network","root":"platform/hub","client_id":"78960c14-26d2-4a0c-ab21-579c3030155e","sub_id":"3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b"},{"name":"Platform - Shared Services","root":"platform/shared-services","client_id":"580ffcfd-51ee-4dc3-9204-d03cb438ff82","sub_id":"859a785c-bd38-402d-b595-1f44f40fb9bf"},{"name":"Workload - TaxBot PaaS","root":"workloads/tax-advisor","client_id":"99ab7987-3989-46c3-bae9-92279be16608","sub_id":"f4ffefe1-d689-4059-969c-ccc73e2a11d4"},{"name":"Workload - BankCompliance AKS","root":"workloads/bank-compliance-ai-aks","client_id":"99ab7987-3989-46c3-bae9-92279be16608","sub_id":"f4ffefe1-d689-4059-969c-ccc73e2a11d4"}]'

          if [ "$EVENT" = "schedule" ] || [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
            SELECTED="$ALL_TARGETS"
          else
            SELECTED=$(echo "$ALL_TARGETS" | jq -c --arg target "$TARGET" '[.[] | select(.root == $target)]')
          fi

          echo "matrix=$SELECTED" >> $GITHUB_OUTPUT

  # ─── STAGE 2: Matrix Scan Across Selected Roots ─────────────────────────────
  detect-drift:
    name: Scan ${{ matrix.name }}
    needs: resolve-targets
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_PROVIDER_RETRY_MAX: "10"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-targets.outputs.matrix) }}

    outputs:
      status: ${{ steps.drift_check.outputs.drift_status }}
      diff: ${{ steps.drift_check.outputs.drift_summary }}
      timestamp: ${{ steps.drift_check.outputs.timestamp }}

    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Azure OIDC Workload Identity Login
        uses: azure/login@v2
        with:
          client-id: ${{ matrix.client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || env.AZURE_TENANT_ID }}
          subscription-id: ${{ matrix.sub_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: Terraform Init & Drift Detection
        id: drift_check
        working-directory: ${{ matrix.root }}
        run: |
          echo "timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "Initializing Terraform backend for ${{ matrix.root }}..."
          
          if [ -f "backend.hcl" ]; then
            terraform init -reconfigure -backend-config=backend.hcl -input=false
          else
            terraform init -input=false
          fi

          echo "Executing terraform plan with -detailed-exitcode..."
          set +e
          if [ -f "prod.tfvars" ]; then
            terraform plan -detailed-exitcode -no-color -out=drift.tfplan -var-file=prod.tfvars > plan_output.txt 2>&1
          else
            terraform plan -detailed-exitcode -no-color -out=drift.tfplan > plan_output.txt 2>&1
          fi
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_status=CLEAN" >> $GITHUB_OUTPUT
            echo "drift_summary=No configuration drift detected." >> $GITHUB_OUTPUT
            echo "### ✅ ${{ matrix.name }}: In Sync (No Drift)" >> $GITHUB_STEP_SUMMARY
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "drift_status=DRIFTED" >> $GITHUB_OUTPUT
            echo "drift_summary=Infrastructure drift detected against committed code." >> $GITHUB_OUTPUT
            echo "### ⚠️ ${{ matrix.name }}: DRIFT DETECTED" >> $GITHUB_STEP_SUMMARY
            echo '```terraform' >> $GITHUB_STEP_SUMMARY
            tail -n 40 plan_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "drift_status=ERROR" >> $GITHUB_OUTPUT
            echo "drift_summary=Terraform execution error." >> $GITHUB_OUTPUT
            echo "### ❌ ${{ matrix.name }}: Terraform Plan Error" >> $GITHUB_STEP_SUMMARY
            cat plan_output.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Drift Plan Artifact
        if: steps.drift_check.outputs.drift_status == 'DRIFTED'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ strategy.job-index }}
          path: ${{ matrix.root }}/plan_output.txt
          retention-days: 7

      # ─── Alerting: Open GitHub Issue on Drift ───────────────────────────────
      - name: Create GitHub Issue on Drift
        if: steps.drift_check.outputs.drift_status == 'DRIFTED'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planSnippet = 'Plan snippet unavailable.';
            try {
              planSnippet = fs.readFileSync('${{ matrix.root }}/plan_output.txt', 'utf8').slice(-3000);
            } catch (e) {}

            const issueBody = `## ⚠️ Terraform Configuration Drift Alert\n\n` +
              `* **Target State Root:** \`${{ matrix.root }}\`\n` +
              `* **Target Scope:** ${{ matrix.name }}\n` +
              `* **Subscription ID:** \`${{ matrix.sub_id }}\`\n` +
              `* **Detection Timestamp:** ${new Date().toISOString()}\n` +
              `* **Alert Recipient:** \`${process.env.NOTIFICATION_EMAIL}\`\n\n` +
              `### 📋 Drift Summary & Proposed Changes:\n` +
              `\`\`\`terraform\n${planSnippet}\n\`\`\`\n\n` +
              `### 🛠️ Recommended Reconciliation Actions:\n` +
              `1. **If out-of-band change was unintentional:** Run the corresponding workflow to apply and self-heal.\n` +
              `2. **If out-of-band change was intentional:** Update the \`${{ matrix.root }}\` code to match Azure and commit to \`main\`.\n\n` +
              `_Triggered by HappyTechies Automated GenAIOps & IaC Governance Engine._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [Drift Alert] Inconsistency detected in ${{ matrix.name }} (${{ matrix.root }})`,
              body: issueBody,
              labels: ['drift-detected', 'iac-governance', 'security']
            });

      # ─── Alerting: Send Direct Email Notification ───────────────────────────
      - name: Send Email Alert to ganesank@mytaxbot.site
        if: steps.drift_check.outputs.drift_status == 'DRIFTED'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true # Ensure workflow completes gracefully even if SMTP secrets are not yet populated
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.sendgrid.net' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME || 'apikey' }}
          password: ${{ secrets.SMTP_PASSWORD || secrets.SENDGRID_API_KEY || '' }}
          subject: '⚠️ [Terraform Drift Alert] Inconsistency detected in ${{ matrix.name }}'
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: 'Terraform IaC Governance <noreply@mytaxbot.site>'
          body: |
            Terraform Configuration Drift Alert
            ==================================

            Target Root     : ${{ matrix.root }}
            Scope Name      : ${{ matrix.name }}
            Subscription ID : ${{ matrix.sub_id }}
            Trigger Event   : ${{ github.event_name }}
            Detected At     : ${{ steps.drift_check.outputs.timestamp }}
            Commit SHA      : ${{ github.sha }}
            Run URL         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Action Required:
            A discrepancy was detected between your live Azure infrastructure and the committed Terraform code in GitHub.
            Please review the attached GitHub run and reconcile the state.

            HappyTechies Cloud & AI Platform Governance
          attachments: ${{ matrix.root }}/plan_output.txt

  # ─── Consolidated Governance Summary ────────────────────────────────────────
  governance-summary:
    name: Drift Governance Summary
    needs: detect-drift
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report Monorepo Drift Status
        run: |
          echo "=============================================================================="
          echo "  HappyTechies Monorepo -- Terraform Multi-Root Drift Governance Report"
          echo "=============================================================================="
          echo "  Notification Recipient : ${{ env.NOTIFICATION_EMAIL }}"
          echo "  Scanned Roots          : 5 Roots (Bootstrap, Hub, Shared, TaxBot, BankCompliance)"
          echo "  Completed At           : $(date -u)"
          echo "=============================================================================="
