# ==============================================================================
# Reusable Workflow Template: Terraform Apply
# Called by: platform-bootstrap, platform-hub, platform-shared-services, workload-tax-advisor
# ==============================================================================

name: Template - Terraform Apply

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      subscription_id:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      tf_version:
        required: false
        type: string
        default: '1.15.8'
    secrets:
      CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working_directory }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working_directory)) }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
