# ==============================================================================
# Workflow: App - BankCompliance AI Application CI/CD
# Provisions & Deploys:
#   1. DevSecOps SAST & SCA Security Scan
#   2. AI Quality & Regression Evaluation Gate (Golden Dataset Benchmarking)
#   3. Backend Docker Container -> GHCR (ghcr.io)
#   4. Kubernetes Pods -> AKS Cluster (aks-ht-bankc-p-cin-01)
#   5. React SPA Frontend -> Azure Static Web App (stapp-ht-bankc-p-cin-01)
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: App - BankCompliance AI CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'app/bank-compliance/**'
      - '.github/workflows/app-bank-compliance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/bank-compliance/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-compliance-backend
  AKS_CLUSTER_NAME: aks-ht-bankc-p-cin-01
  AKS_RESOURCE_GROUP: rg-ht-bankc-p-cin-01
  SUBSCRIPTION_ID: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

jobs:
  # ── JOB 0: DevSecOps SAST & SCA Security Scanning (Phase 1) ────────────────
  devsecops-scan:
    name: DevSecOps SAST & SCA Scan
    uses: RepoCodeGanesh/.github/.github/workflows/app-sec-scan.yml@main
    with:
      working_directory: 'app/bank-compliance'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 1: Continuous AI Quality & Regression Evaluation Gate (GenAIOps) ───
  ai-eval-quality-gate:
    name: AI Quality & Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GenAIOps Regression Evaluation
        run: |
          python app/bank-compliance/eval/evaluate.py

      - name: Upload AI Scorecard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genaiops-quality-scorecard
          path: app/bank-compliance/eval/eval_results.json
          retention-days: 14

  # ── JOB 2: Build & Push Backend Container to GHCR ─────────────────────────
  build-and-push-backend:
    name: Build & Push Backend Image
    needs: [devsecops-scan, ai-eval-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: prep_tag
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT
          echo "image_sha_tag=${IMAGE_LOWER}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: app/bank-compliance/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep_tag.outputs.image_tag }}
            ${{ steps.prep_tag.outputs.image_sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Deploy Kubernetes Manifests to AKS ─────────────────────────────
  deploy-aks:
    name: Deploy to AKS
    needs: build-and-push-backend
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: bank-compliance-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy BankCompliance AI via Helm
        run: |
          OPENAI_ENDPOINT=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-endpoint --query value -o tsv)
          OPENAI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-api-key --query value -o tsv)
          GEMINI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name gemini-api-key --query value -o tsv)
          
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          kubectl create namespace bank-compliance --dry-run=client -o yaml | kubectl apply -f -
          
          helm upgrade --install bank-compliance ./app/bank-compliance/chart \
            --namespace bank-compliance \
            --set backend.image.repository="${IMAGE_LOWER}" \
            --set backend.image.tag="${{ github.sha }}" \
            --set secrets.openaiEndpoint="$OPENAI_ENDPOINT" \
            --set secrets.openaiKey="$OPENAI_KEY" \
            --set secrets.geminiApiKey="$GEMINI_KEY" \
            --wait \
            --timeout 5m

      - name: Deploy Prometheus & Grafana Observability Stack
        working-directory: app/bank-compliance/k8s/monitoring
        run: |
          chmod +x deploy-monitoring.sh
          ./deploy-monitoring.sh

  # ── JOB 4: Build & Deploy Frontend to Azure Static Web App (Reusable Called) ─
  deploy-frontend:
    name: Build & Deploy Frontend SPA
    needs: [devsecops-scan, ai-eval-quality-gate]
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-deploy-swa.yml@main
    with:
      static_web_app_name: 'stapp-ht-bankc-p-cin-01'
      working_directory: 'app/bank-compliance/frontend'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
      swa_token_secret_name: 'bankc-swa-deployment-token'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
