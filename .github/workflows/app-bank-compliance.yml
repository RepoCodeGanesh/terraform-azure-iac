# ==============================================================================
# Workflow: App - BankCompliance AI Application CI/CD
# Provisions & Deploys:
#   1. Backend Docker Container -> GHCR (ghcr.io)
#   2. Kubernetes Pods -> AKS Cluster (aks-ht-bankc-p-cin-01)
#   3. React SPA Frontend -> Azure Static Web App (stapp-ht-bankc-p-cin-01)
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: App - BankCompliance AI CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'app/bank-compliance/**'
      - '.github/workflows/app-bank-compliance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/bank-compliance/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-compliance-backend
  AKS_CLUSTER_NAME: aks-ht-bankc-p-cin-01
  AKS_RESOURCE_GROUP: rg-ht-bankc-p-cin-01

jobs:
  # ── JOB 1: Build & Push Backend Container to GHCR ─────────────────────────
  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/$(echo ${{ env.IMAGE_NAME }} | tr '[A-Z]' '[a-z]'):latest" >> $GITHUB_ENV
          echo "IMAGE_SHA_TAG=${{ env.REGISTRY }}/$(echo ${{ env.IMAGE_NAME }} | tr '[A-Z]' '[a-z]'):${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: app/bank-compliance/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 2: Deploy Kubernetes Manifests to AKS ─────────────────────────────
  deploy-aks:
    name: Deploy to AKS
    needs: build-and-push-backend
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: bank-compliance-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy Kubernetes Manifests
        working-directory: app/bank-compliance/k8s
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f serviceaccount.yaml
          kubectl apply -f backend-configmap.yaml
          kubectl create configmap litellm-config --from-file=config.yaml=litellm/config.yaml -n bank-compliance --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f litellm/deployment.yaml
          kubectl apply -f backend-deployment.yaml
          kubectl rollout restart deployment/bankc-backend -n bank-compliance || true

  # ── JOB 3: Build & Deploy Frontend to Azure Static Web App ─────────────────
  deploy-frontend:
    name: Build & Deploy Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login (Fetch SWA Token if needed)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA Deployment Token from Azure CLI
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list --name stapp-ht-bankc-p-cin-01 --resource-group rg-ht-bankc-p-cin-01 --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.SWA_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app/bank-compliance/frontend"
          output_location: "dist"
