# ==============================================================================
# Workflow: App - BankCompliance AI Application CI/CD
# Provisions & Deploys:
#   1. DevSecOps SAST & SCA Security Scan
#   2. AI Quality & Regression Evaluation Gate (Golden Dataset Benchmarking)
#   3. Backend Docker Container -> GHCR (ghcr.io)
#   4. Kubernetes Pods -> AKS Cluster (aks-ht-bankc-p-cin-01)
#   5. React SPA Frontend -> Azure Static Web App (stapp-ht-bankc-p-cin-01)
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: App - BankCompliance AI CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'app/bank-compliance/**'
      - '.github/workflows/app-bank-compliance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/bank-compliance/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: a second push QUEUES behind the current deploy instead of killing it mid-Helm.
  # Killing helm mid-upgrade leaves the release in a FAILED state requiring manual rollback.
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-compliance-backend
  AKS_CLUSTER_NAME: aks-ht-bankc-p-cin-01
  AKS_RESOURCE_GROUP: rg-ht-bankc-p-cin-01
  SUBSCRIPTION_ID: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

jobs:
  # ── JOB 0: DevSecOps SAST & SCA Security Scanning (Phase 1) ────────────────
  devsecops-scan:
    name: DevSecOps SAST & SCA Scan
    uses: RepoCodeGanesh/.github/.github/workflows/app-sec-scan.yml@main
    with:
      working_directory: 'app/bank-compliance'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 1: Continuous AI Quality & Regression Evaluation Gate (GenAIOps) ───
  ai-eval-quality-gate:
    name: AI Quality & Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GenAIOps Regression & Cost Evaluation
        run: |
          python app/bank-compliance/eval/evaluate.py --mode fast --max-cost 0.05

      - name: Upload GenAIOps Scorecard & FinOps Attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genaiops-evaluation-attestation
          path: |
            app/bank-compliance/eval/eval_results.json
            app/bank-compliance/eval/eval_cost_summary.json
            app/bank-compliance/eval/eval_attestation.json
          retention-days: 30

  # ── JOB 2: Build & Push Backend Container to GHCR ─────────────────────────
  build-and-push-backend:
    name: Build & Push Backend Image
    needs: [devsecops-scan, ai-eval-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: prep_tag
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT
          echo "image_sha_tag=${IMAGE_LOWER}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: app/bank-compliance/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep_tag.outputs.image_tag }}
            ${{ steps.prep_tag.outputs.image_sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Deploy Kubernetes Manifests to AKS ─────────────────────────────
  deploy-backend-aks:
    name: Deploy to AKS
    needs: build-and-push-backend
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: bank-compliance-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy BankCompliance AI via Helm
        run: |
          OPENAI_ENDPOINT=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-endpoint --query value -o tsv)
          OPENAI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-api-key --query value -o tsv)
          GEMINI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name gemini-api-key --query value -o tsv)

          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # ── Resolve Workload Identity Client ID from live Azure resource ────────
          # This is the ONLY value that changes on every Terraform destroy+apply
          # because the UAMI gets a new object ID each time. Fetching live from
          # Azure prevents any manual intervention after infra recreate.
          UAMI_CLIENT_ID=$(az identity show \
            --name uami-ht-bankc-p-cin-01 \
            --resource-group rg-ht-bankc-p-cin-01 \
            --query clientId -o tsv)

          if [ -z "$UAMI_CLIENT_ID" ]; then
            echo "❌ ERROR: Could not resolve UAMI client ID — UAMI may not exist yet. Run Terraform apply first."
            exit 1
          fi

          echo "✅ Resolved UAMI Client ID: ${UAMI_CLIENT_ID}"

          kubectl create namespace bank-compliance --dry-run=client -o yaml | kubectl apply -f -

          # FinOps & Compute Right-Sizing: Deploy Tuned Ingress-NGINX (1m CPU)
          kubectl apply -f ./app/bank-compliance/k8s/nginx/ingress-nginx.yaml

          # Wait for Ingress-NGINX LoadBalancer IP to be assigned before Helm
          echo "⏳ Waiting for Ingress-NGINX LoadBalancer IP..."
          for i in $(seq 1 24); do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$INGRESS_IP" ]; then
              echo "✅ Ingress-NGINX is ready at IP: $INGRESS_IP"
              break
            fi
            echo "  Attempt $i/24 — waiting 10s..."
            sleep 10
          done

          # ── Auto-recover from stuck Helm release (caused by killed CI jobs) ────────
          # When a GHA job is canceled mid-Helm, the release is left in 'pending-upgrade'
          # or 'pending-install'. The next run fails immediately. This step detects and
          # auto-heals the state by patching the secret label to 'failed' so Helm can
          # proceed. No manual kubectl intervention ever needed.
          HELM_STATUS=$(kubectl get secret -n bank-compliance \
            -l "owner=helm,name=bank-compliance" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.labels.status}' 2>/dev/null || echo "none")

          echo "Current Helm release status: $HELM_STATUS"

          if [ "$HELM_STATUS" = "pending-upgrade" ] || [ "$HELM_STATUS" = "pending-install" ]; then
            echo "⚠️ Stuck Helm release detected ($HELM_STATUS) — auto-recovering..."
            STUCK_SECRET=$(kubectl get secret -n bank-compliance \
              -l "owner=helm,name=bank-compliance,status=$HELM_STATUS" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            kubectl label secret "$STUCK_SECRET" -n bank-compliance status=failed --overwrite
            echo "✅ Helm release unlocked — proceeding with upgrade"
          fi

          helm upgrade --install bank-compliance ./app/bank-compliance/chart \
            --namespace bank-compliance \
            --set backend.image.repository="${IMAGE_LOWER}" \
            --set backend.image.tag="${{ github.sha }}" \
            --set secrets.openaiEndpoint="$OPENAI_ENDPOINT" \
            --set secrets.openaiKey="$OPENAI_KEY" \
            --set secrets.geminiApiKey="$GEMINI_KEY" \
            --set serviceAccount.clientId="$UAMI_CLIENT_ID" \
            --wait \
            --timeout 10m

      - name: Collect AKS Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== Pods in bank-compliance ==="
          kubectl get pods -n bank-compliance -o wide
          echo "=== Services in bank-compliance ==="
          kubectl get svc -n bank-compliance
          echo "=== Pod Events & Description ==="
          kubectl describe pods -n bank-compliance
          echo "=== Backend Logs ==="
          kubectl logs -n bank-compliance -l app=bankc-backend --tail=100 || true
          echo "=== LiteLLM Logs ==="
          kubectl logs -n bank-compliance -l app=litellm-proxy --tail=100 || true

      # ── End-to-End Smoke Test: Validates entire chain is working post-deploy ──
      # Why: Catches silent failures (model deprecation, APIM mis-routing, cold
      #      start errors) that don't fail the Helm deploy but break the live UI.
      - name: 🔥 E2E Smoke Test — AI Compliance Query (APIM → NGINX → Gemini)
        run: |
          echo "⏳ Waiting 20s for pods to stabilize after Helm rollout..."
          sleep 20

          echo "🚀 Sending live compliance query through APIM gateway..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://apim-ht-ss-p-cin-01.azure-api.net/bankc/api/v1/compliance/query" \
            -H "Content-Type: application/json" \
            -d '{"query": "What are the RBI data localization rules for banking transaction records?"}' \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SMOKE TEST FAILED: APIM returned HTTP $HTTP_CODE"
            echo "Response body: $BODY"
            exit 1
          fi

          # Validate the response is a real AI answer, not an abstention/empty
          MODEL_USED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('model_used',''))")
          CITATION_COUNT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('citations',[])))")

          echo "Model used: $MODEL_USED"
          echo "Citations returned: $CITATION_COUNT"

          if echo "$MODEL_USED" | grep -q "abstention"; then
            echo "❌ SMOKE TEST FAILED: Response was an out-of-scope abstention — AI model may be misconfigured"
            echo "Full response: $BODY"
            exit 1
          fi

          if [ "$CITATION_COUNT" -lt 1 ]; then
            echo "❌ SMOKE TEST FAILED: No citations returned — Qdrant or retrieval pipeline is broken"
            echo "Full response: $BODY"
            exit 1
          fi

          echo "✅ SMOKE TEST PASSED: model=$MODEL_USED citations=$CITATION_COUNT"


      - name: Generate AKS Production Release Step Summary
        if: always()
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          cat << EOF >> $GITHUB_STEP_SUMMARY

          ### 🚀 BankCompliance AI — Production Deployment Summary
          **Release Status:** ✅ \`Successfully Deployed to AKS\`
          **Target Environment:** \`bank-compliance-prod\` (Apps-prod Subscription)

          | Resource | Value / Configuration | Status |
          | :--- | :--- | :--- |
          | **Live Domain** | [https://bank.mytaxbot.site](https://bank.mytaxbot.site) | 🟢 Active |
          | **AKS Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` (\`bank-compliance\` namespace) | 🟢 Ready |
          | **Backend Container** | \`${IMAGE_LOWER}:${{ github.sha }}\` | 🟢 Running |
          | **AI Gateway (LiteLLM)** | Azure OpenAI ➔ Google Gemini Fallback Chain | 🟢 Healthy |
          | **Vector Database (Qdrant)** | 4GB CSI Azure Managed Disk | 🟢 Connected |
          | **FinOps Autoscaler** | KEDA Scale-to-Zero (0 to 5 Pods) | 🟢 Enabled (\$0 Idle) |
          | **Observability** | Azure Container Insights + Log Analytics (law-ht-ss-p-cin-01) | 🟢 Streaming |

          EOF

  # ── JOB 4: Build & Deploy Frontend to Azure Static Web App (Reusable Called) ─
  deploy-frontend:
    name: Build & Deploy Frontend SPA
    needs: [devsecops-scan, ai-eval-quality-gate]
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-deploy-swa.yml@main
    with:
      static_web_app_name: 'stapp-ht-bankc-p-cin-01'
      working_directory: 'app/bank-compliance/frontend'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
      swa_token_secret_name: 'bankc-swa-deployment-token'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 5: Consolidated Dynamic Release Governance Summary ──────────────────
  summary:
    name: 📊 Release Governance Summary
    needs: [devsecops-scan, ai-eval-quality-gate, deploy-backend-aks, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate True Release Summary
        run: |
          SAST_STATUS="${{ needs.devsecops-scan.result == 'success' && '🟢 PASSED' || (needs.devsecops-scan.result == 'failure' && '🔴 FAILED' || '⚪ SKIPPED') }}"
          EVAL_STATUS="${{ needs.ai-eval-quality-gate.result == 'success' && '🟢 PASSED' || (needs.ai-eval-quality-gate.result == 'failure' && '🔴 FAILED' || '⚪ SKIPPED') }}"
          BACKEND_STATUS="${{ needs.deploy-backend-aks.result == 'success' && '🟢 DEPLOYED' || (needs.deploy-backend-aks.result == 'failure' && '🔴 FAILED' || '⚪ SKIPPED') }}"
          FRONTEND_STATUS="${{ needs.deploy-frontend.result == 'success' && '🟢 DEPLOYED' || (needs.deploy-frontend.result == 'failure' && '🔴 FAILED' || '⚪ SKIPPED') }}"

          OVERALL="🟢 RELEASE SUCCESSFUL"
          if [ "${{ needs.devsecops-scan.result }}" = "failure" ] || [ "${{ needs.ai-eval-quality-gate.result }}" = "failure" ] || [ "${{ needs.deploy-backend-aks.result }}" = "failure" ] || [ "${{ needs.deploy-frontend.result }}" = "failure" ]; then
            OVERALL="🔴 PIPELINE FAILED"
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 BankCompliance AI — Production Pipeline Release Summary

          > **Overall Outcome:** \`${OVERALL}\`
          > **Target Environment:** \`bank-compliance-prod\` (Apps-prod Subscription)
          > **Commit SHA:** \`${{ github.sha }}\` | **Trigger:** \`${{ github.event_name }}\`

          ---

          ### 📋 Multi-Stage Pipeline Execution Matrix

          | Pipeline Stage | Responsibilities | Execution Result |
          |---|---|:---:|
          | **1. DevSecOps Security Scan** | Bandit Python SAST + pip-audit & npm audit | ${SAST_STATUS} |
          | **2. GenAIOps Quality Gate** | Ragas Triad Groundedness & Citation Evaluation | ${EVAL_STATUS} |
          | **3. Backend AKS Release** | Multi-stage Docker build + Helm upgrade to AKS | ${BACKEND_STATUS} |
          | **4. Frontend SPA Release** | React Vite build deployed to Azure Static Web Apps | ${FRONTEND_STATUS} |

          ---

          ### 🌐 Live Production Endpoints:
          * **Production Domain:** [https://bank.mytaxbot.site](https://bank.mytaxbot.site)
          * **APIM Gateway Endpoint:** \`https://apim-ht-ss-p-cin-01.azure-api.net/bankc\`
          EOF
