# ==============================================================================
# Workflow: Platform - Hub Network IaC (Uses Central Organization Templates)
# Provisions: Hub VNet (vnet-ht-hub-p-cin-01) & Central Firewall/Routing
# Target Subscription: Hub-prod (3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b)
# Central Template Repo: RepoCodeGanesh/.github
# ==============================================================================

name: Platform - Hub Network IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/hub/**'
      - '.github/workflows/platform-hub.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/hub/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: RepoCodeGanesh/.github/.github/workflows/tf-plan.yml@main
    with:
      working_directory: 'platform/hub'
      subscription_id: '3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b'
      environment_name: 'hub-prod'
      artifact_name: 'hub-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.HUB_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/tf-apply.yml@main
    with:
      working_directory: 'platform/hub'
      subscription_id: '3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b'
      environment_name: 'hub-prod'
      artifact_name: 'hub-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.HUB_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
