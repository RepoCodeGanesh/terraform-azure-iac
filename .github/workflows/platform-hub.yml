# ==============================================================================
# Workflow: Platform - Hub Network IaC (True Level 3 Golden Path)
# Provisions: Hub VNet (vnet-ht-hub-p-cin-01) & Central Firewall/Routing
# Target Subscription: Hub-prod (3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Platform - Hub Network IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/hub/**'
      - '.github/workflows/platform-hub.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/hub/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  hub-iac:
    name: 🌐 Hub Network IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'platform/hub'
      subscription_id: '3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b'
      environment_name: 'hub-prod'
      artifact_name: 'hub-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.HUB_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
