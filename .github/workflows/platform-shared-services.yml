# ==============================================================================
# Workflow: Platform - Shared Services IaC (True Level 3 Golden Path)
# Provisions: APIM Gateway, Log Analytics, Key Vault & Private DNS Zones
# Target Subscription: Shared-services (859a785c-bd38-402d-b595-1f44f40fb9bf)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Platform - Shared Services IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/shared-services/**'
      - '.github/workflows/platform-shared-services.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/shared-services/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  shared-services-iac:
    name: ⚙️ Shared Services IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'platform/shared-services'
      subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
      environment_name: 'shared-services-prod'
      artifact_name: 'shared-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
