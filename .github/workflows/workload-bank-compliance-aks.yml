# ==============================================================================
# Workflow: Workload - BankCompliance AI Infrastructure IaC (Uses Central Org Templates)
# Provisions: AKS Free Tier & AI Landing Zone for BankCompliance AI
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# Central Template Repo: RepoCodeGanesh/.github
# ==============================================================================

name: Workload - BankCompliance AI IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'workloads/bank-compliance-ai-aks/**'
      - '.github/workflows/workload-bank-compliance-aks.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'workloads/bank-compliance-ai-aks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: RepoCodeGanesh/.github/.github/workflows/tf-plan.yml@main
    with:
      working_directory: 'workloads/bank-compliance-ai-aks'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'bank-compliance-prod'
      artifact_name: 'bank-compliance-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/tf-apply.yml@main
    with:
      working_directory: 'workloads/bank-compliance-ai-aks'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'bank-compliance-prod'
      artifact_name: 'bank-compliance-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  summary:
    name: Summary
    needs: [plan, apply]
    if: always() && (needs.apply.result == 'success' || needs.plan.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: |
          ACTION="${{ needs.apply.result == 'success' && 'apply' || 'plan' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY

          ### Terraform Azure Landing Zone Summary
          **Target Root:** \`workloads/bank-compliance-ai-aks\`
          **Action:** \`${ACTION}\`
          **Azure Subscription ID:** \`f4ffefe1-d689-4059-969c-ccc73e2a11d4\`
          **Target Environment:** \`bank-compliance-prod\`

          | CAF Governance Check | Configuration | Status |
          | :--- | :--- | :--- |
          | **Remote State Backend** | \`sthtbootpcin01\` (Azure AD Auth) | Connected |
          | **State Key** | \`workloads/bank-compliance-ai-aks/prod.tfstate\` | Isolated |
          | **Workload Identity (WIF)** | Entra ID Federated OIDC | Authenticated |
          | **Cost Policy** | Low-Cost / Free-Tier SKUs Enforced | Verified |

          EOF
