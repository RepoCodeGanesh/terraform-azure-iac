# ==============================================================================
# Workflow: Workload - BankCompliance AI Infrastructure IaC (True Level 3 Golden Path)
# Provisions: AKS Free Tier & AI Landing Zone for BankCompliance AI
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Workload - BankCompliance AI IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'workloads/bank-compliance-ai-aks/**'
      - '.github/workflows/workload-bank-compliance-aks.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'workloads/bank-compliance-ai-aks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  bank-compliance-iac:
    name: 🏦 BankCompliance Infrastructure IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'workloads/bank-compliance-ai-aks'
      subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      environment_name: 'bank-compliance-prod'
      artifact_name: 'bank-compliance-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
