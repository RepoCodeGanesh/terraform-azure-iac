# ==============================================================================
# Reusable Called Workflow: Static Web App Deployment
# Fetches SWA token from Key Vault, builds React SPA, and deploys
# ==============================================================================

name: Reusable Static Web App Deploy

on:
  workflow_call:
    inputs:
      static_web_app_name:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      key_vault_name:
        required: true
        type: string
      shared_subscription_id:
        required: true
        type: string
    secrets:
      SHARED_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

env:
  SWA_CLI_DEPLOYMENT_TOKEN: ''

jobs:
  deploy-frontend:
    name: Build & Deploy React Frontend
    runs-on: ubuntu-latest
    environment: tax-advisor-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC) — Shared-services (Key Vault)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SHARED_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.shared_subscription_id }}

      - name: Fetch SWA Deployment Token from Key Vault
        run: |
          TOKEN=$(az keyvault secret show \
            --vault-name "${{ inputs.key_vault_name }}" \
            --name "SWA-TAXB-DEPLOYMENT-TOKEN" \
            --subscription "${{ inputs.shared_subscription_id }}" \
            --query "value" -o tsv 2>/dev/null || echo "")
          echo "::add-mask::$TOKEN"
          echo "SWA_CLI_DEPLOYMENT_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build Production React Bundle
        run: |
          cd ${{ inputs.working_directory }}
          npm install
          npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_CLI_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ inputs.working_directory }}
          output_location: dist
