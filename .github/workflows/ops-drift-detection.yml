# ==============================================================================
# Workflow: Automated Multi-Root Terraform Drift Detection & Governance Engine
# Monorepo: HappyTechies Enterprise Azure Landing Zone
# Target Email: ganesank@mytaxbot.site
# Schedule: Daily at 02:00 UTC (07:30 IST) + On-Demand Manual Trigger
# ==============================================================================

name: 'Terraform Drift Detection'

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_root:
        description: 'Terraform Root to Scan (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'platform/governance'
          - 'platform/bootstrap'
          - 'platform/hub'
          - 'platform/shared-services'
          - 'workloads/tax-advisor'
          - 'workloads/bank-compliance-ai-aks'

permissions:
  id-token: write
  contents: read
  issues: write

env:
  NOTIFICATION_EMAIL: 'richtextforganesh@outlook.com'
  AZURE_TENANT_ID: '4cef0d84-84d6-4ed0-8abe-773b015bcf99'

jobs:
  # ─── STAGE 1: Dynamically Resolve Target Roots Based on Trigger/Input ───────
  resolve-targets:
    name: Resolve Target Roots
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ github.event.inputs.target_root || 'all' }}"
          EVENT="${{ github.event_name }}"

          ALL_TARGETS='[{"name":"Platform - Governance","root":"platform/governance","client_id":"934ab83b-2f61-475e-bdbc-85c9eaed83e6","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"7689ad81-71ba-481b-a17c-e1b6be61bab1","env_name":"bootstrap-prod"},{"name":"Platform - Bootstrap","root":"platform/bootstrap","client_id":"934ab83b-2f61-475e-bdbc-85c9eaed83e6","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"7689ad81-71ba-481b-a17c-e1b6be61bab1","env_name":"bootstrap-prod"},{"name":"Platform - Hub Network","root":"platform/hub","client_id":"78960c14-26d2-4a0c-ab21-579c3030155e","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b","env_name":"hub-prod"},{"name":"Platform - Shared Services","root":"platform/shared-services","client_id":"580ffcfd-51ee-4dc3-9204-d03cb438ff82","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"859a785c-bd38-402d-b595-1f44f40fb9bf","env_name":"shared-services-prod"},{"name":"Workload - TaxBot PaaS","root":"workloads/tax-advisor","client_id":"99ab7987-3989-46c3-bae9-92279be16608","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"f4ffefe1-d689-4059-969c-ccc73e2a11d4","env_name":"tax-advisor-prod"},{"name":"Workload - BankCompliance AKS","root":"workloads/bank-compliance-ai-aks","client_id":"99ab7987-3989-46c3-bae9-92279be16608","tenant_id":"4cef0d84-84d6-4ed0-8abe-773b015bcf99","sub_id":"f4ffefe1-d689-4059-969c-ccc73e2a11d4","env_name":"bank-compliance-prod"}]'

          if [ "$EVENT" = "schedule" ] || [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
            SELECTED="$ALL_TARGETS"
          else
            SELECTED=$(echo "$ALL_TARGETS" | jq -c --arg target "$TARGET" '[.[] | select(.root == $target)]')
          fi

          echo "matrix=$SELECTED" >> $GITHUB_OUTPUT

  # ─── STAGE 2: Matrix Scan Across Selected Roots ─────────────────────────────
  detect-drift:
    name: Scan ${{ matrix.name }}
    needs: resolve-targets
    runs-on: ubuntu-latest
    environment: ${{ matrix.env_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ matrix.client_id }}
      ARM_TENANT_ID: ${{ matrix.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ matrix.sub_id }}
      ARM_PROVIDER_RETRY_MAX: "10"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-targets.outputs.matrix) }}

    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Azure OIDC Workload Identity Login
        uses: azure/login@v2
        with:
          client-id: ${{ matrix.client_id }}
          tenant-id: ${{ matrix.tenant_id }}
          subscription-id: ${{ matrix.sub_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.0'
          terraform_wrapper: false

      - name: Terraform Init & Drift Detection
        id: drift_check
        working-directory: ${{ matrix.root }}
        run: |
          echo "Initializing Terraform backend for ${{ matrix.root }}..."
          
          VAR_ARG=""
          if [ -f "prod.tfvars" ]; then
            VAR_ARG="-var-file=prod.tfvars"
          fi

          set +e
          if [ -f "backend.hcl" ]; then
            terraform init -reconfigure -backend-config=backend.hcl -input=false > plan_output.txt 2>&1
          else
            terraform init -input=false > plan_output.txt 2>&1
          fi
          INIT_EXIT_CODE=$?

          if [ $INIT_EXIT_CODE -ne 0 ]; then
            EXIT_CODE=1
            echo "Terraform init failed with exit code $INIT_EXIT_CODE"
          else
            echo "Executing terraform plan with -detailed-exitcode..."
            terraform plan -detailed-exitcode -no-color -out=drift.tfplan $VAR_ARG > plan_output.txt 2>&1
            EXIT_CODE=$?
          fi
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            STATUS="IN_SYNC"
            BADGE="🟢 IN SYNC"
            SUMMARY="No configuration drift detected."
          elif [ $EXIT_CODE -eq 2 ]; then
            STATUS="DRIFTED"
            BADGE="🟡 DRIFT DETECTED"
            SUMMARY="Infrastructure drift detected against committed code."
          else
            STATUS="ERROR"
            BADGE="🔴 EXECUTION ERROR"
            SUMMARY="Terraform execution failed."
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Save uniquely named JSON for dynamic aggregator
          cat << EOF > "status-${{ matrix.env_name }}.json"
          {
            "name": "${{ matrix.name }}",
            "root": "${{ matrix.root }}",
            "sub_id": "${{ matrix.sub_id }}",
            "status": "$STATUS",
            "badge": "$BADGE",
            "summary": "$SUMMARY",
            "exit_code": $EXIT_CODE,
            "timestamp": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          }
          EOF

          echo "### $BADGE: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -ne 0 ]; then
            echo '```terraform' >> $GITHUB_STEP_SUMMARY
            tail -n 30 plan_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Status Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.env_name }}
          path: ${{ matrix.root }}/status-${{ matrix.env_name }}.json
          retention-days: 7

      - name: Upload Drift Plan Artifact
        if: steps.drift_check.outputs.status == 'DRIFTED'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ matrix.env_name }}
          path: ${{ matrix.root }}/plan_output.txt
          retention-days: 7

      # ─── Alerting: Open GitHub Issue on Drift ───────────────────────────────
      - name: Create GitHub Issue on Drift
        if: steps.drift_check.outputs.status == 'DRIFTED'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planSnippet = 'Plan snippet unavailable.';
            try {
              planSnippet = fs.readFileSync('${{ matrix.root }}/plan_output.txt', 'utf8').slice(-3000);
            } catch (e) {}

            const issueBody = `## ⚠️ Terraform Configuration Drift Alert\n\n` +
              `* **Target State Root:** \`${{ matrix.root }}\`\n` +
              `* **Target Scope:** ${{ matrix.name }}\n` +
              `* **Subscription ID:** \`${{ matrix.sub_id }}\`\n` +
              `* **Detection Timestamp:** ${new Date().toISOString()}\n` +
              `* **Alert Recipient:** \`${process.env.NOTIFICATION_EMAIL}\`\n\n` +
              `### 📋 Drift Summary & Proposed Changes:\n` +
              `\`\`\`terraform\n${planSnippet}\n\`\`\`\n\n` +
              `### 🛠️ Recommended Reconciliation Actions:\n` +
              `1. **If out-of-band change was unintentional:** Run the corresponding workflow to apply and self-heal.\n` +
              `2. **If out-of-band change was intentional:** Update the \`${{ matrix.root }}\` code to match Azure and commit to \`main\`.\n\n` +
              `_Triggered by HappyTechies Automated GenAIOps & IaC Governance Engine._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [Drift Alert] Inconsistency detected in ${{ matrix.name }} (${{ matrix.root }})`,
              body: issueBody,
              labels: ['drift-detected', 'iac-governance', 'security']
            });

  # ─── Consolidated Dynamic Governance Summary ────────────────────────────────
  governance-summary:
    name: 📊 Real-Time Drift Governance Dashboard
    needs: [resolve-targets, detect-drift]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Download All Status Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-statuses
          pattern: status-*
          merge-multiple: true

      - name: Generate Dynamic Executive Dashboard
        run: |
          python3 scripts/generate_drift_dashboard.py all-statuses
