# ==============================================================================
# Reusable Workflow Template: Terraform Plan
# Called by: platform-bootstrap, platform-hub, platform-shared-services, workload-tax-advisor
# ==============================================================================

name: z-Reusable - Terraform Plan

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      subscription_id:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      tf_version:
        required: false
        type: string
        default: '1.15.8'
    secrets:
      CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working_directory }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working_directory)) }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=prod.tfvars -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 3
