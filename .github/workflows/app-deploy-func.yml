# ==============================================================================
# Reusable Called Workflow: Function App Deployment
# Packages Python backend, deploys via ZipDeploy, and executes healthcheck
# Fully Parameterized for Upcoming Applications & Customizations
# ==============================================================================

name: Reusable Function App Deploy

on:
  workflow_call:
    inputs:
      function_app_name:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      app_subscription_id:
        required: true
        type: string
      python_version:
        type: string
        default: '3.11'
      health_endpoint:
        type: string
        default: '/api/health'
    secrets:
      APP_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-backend:
    name: Deploy Python Function App Backend
    runs-on: ubuntu-latest
    environment: tax-advisor-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login (OIDC) — Apps-prod
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.app_subscription_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install manylinux2014 Compatible Wheels
        run: |
          cd ${{ inputs.working_directory }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --target=".python_packages/lib/site-packages" \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 311 \
            --implementation cp \
            --upgrade

      - name: Package Function App
        run: |
          cd ${{ inputs.working_directory }}
          zip -r ../../../functionapp.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Upload Backend Package as Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: taxbot-backend-package
          path: functionapp.zip
          retention-days: 7

      - name: Deploy to Azure Function App (ZipDeploy)
        uses: azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name }}
          package: functionapp.zip

      - name: Healthcheck & Auto-Rollback Gate
        run: |
          FUNC_URL="https://${{ inputs.function_app_name }}.azurewebsites.net${{ inputs.health_endpoint }}"
          echo "Pinging healthcheck: ${FUNC_URL}"
          HEALTH_STATUS="FAILED"
          for i in {1..6}; do
            echo "Attempt $i/6..."
            RESPONSE=$(curl -s -m 10 "$FUNC_URL" || echo "")
            if echo "$RESPONSE" | grep -q '"status":\s*"healthy"'; then
              echo "✅ Healthcheck PASSED!"
              HEALTH_STATUS="PASSED"
              break
            fi
            sleep 5
          done
          if [ "$HEALTH_STATUS" != "PASSED" ]; then
            echo "❌ Healthcheck FAILED — marking deployment as failed."
            exit 1
          fi
