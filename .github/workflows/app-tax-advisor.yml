# ==============================================================================
# Workflow: App - TaxBot India Application CI/CD (Caller Workflow)
# Pattern: Enterprise Caller/Called Reusable Workflow Pattern (Local Workflows)
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: App - TaxBot India CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['release/*', 'v*']
    paths:
      - 'app/tax-advisor/**'
      - '.github/workflows/app-tax-advisor.yml'
      - '.github/workflows/app-sec-scan.yml'
      - '.github/workflows/app-deploy-func.yml'
      - '.github/workflows/app-deploy-swa.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/tax-advisor/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # ── JOB 0: DevSecOps SAST & SCA Security Scanning (Called Local Template) ──
  devsecops-scan:
    name: DevSecOps SAST & SCA Scan
    uses: ./.github/workflows/app-sec-scan.yml
    with:
      working_directory: 'app/tax-advisor'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 1: Deploy Python Backend Function App (Called Local Template) ──────
  deploy-backend:
    name: Deploy Python Function App Backend
    needs: devsecops-scan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: ./.github/workflows/app-deploy-func.yml
    with:
      function_app_name: 'func-ht-taxb-p-cin-01'
      working_directory: 'app/tax-advisor/backend'
      app_subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 2: Upload RAG Documents to Blob Storage (App-Specific Job) ────────
  upload-documents:
    name: Upload RAG Documents
    runs-on: ubuntu-latest
    environment: tax-advisor-prod
    needs: deploy-backend
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC) — Apps-prod
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

      - name: Sync RAG Text Files to Blob Storage (Incremental & Auto-Clean)
        run: |
          echo "Syncing FY 2026-27 RAG documents via Entra ID RBAC..."
          az storage blob sync \
            --account-name "sthttaxbpcin01" \
            --container "documents" \
            --source "app/tax-advisor/documents" \
            --auth-mode login

  # ── JOB 3: Build & Deploy React Frontend SPA (Called Local Template) ───────
  deploy-frontend:
    name: Build & Deploy React Frontend
    needs: upload-documents
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: ./.github/workflows/app-deploy-swa.yml
    with:
      static_web_app_name: 'stapp-ht-taxb-p-cin-01'
      working_directory: 'app/tax-advisor/frontend'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 4: Configure CORS & Enterprise SemVer Tagging ──────────────────────
  configure-cors:
    name: Configure CORS & APIM
    runs-on: ubuntu-latest
    environment: tax-advisor-prod
    needs: deploy-frontend
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC) — Apps-prod
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

      - name: Set CORS Allowed Origins on Function App
        run: |
          SWA_HOST=$(az staticwebapp show \
            --name "stapp-ht-taxb-p-cin-01" \
            --resource-group "rg-ht-taxb-p-cin-01" \
            --query "defaultHostname" -o tsv 2>/dev/null || echo "")
          echo "SWA Hostname: https://${SWA_HOST}"
          if [ -n "$SWA_HOST" ]; then
            az functionapp cors add \
              --name "func-ht-taxb-p-cin-01" \
              --resource-group "rg-ht-taxb-p-cin-01" \
              --allowed-origins "https://${SWA_HOST}" "*"
            echo "✅ CORS configured successfully."
          fi

      - name: Auto-Create Enterprise Git Release Tag & GitHub Release (SemVer)
        if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) && github.event_name == 'push')
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          create_release: true
