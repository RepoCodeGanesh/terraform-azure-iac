name: App - TaxBot India CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'app/tax-advisor/**'
      - '.github/workflows/app-tax-advisor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/tax-advisor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  golden-path-release:
    name: 🚀 Production AI Delivery
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-serverless-workload-pipeline.yml@main
    with:
      app_name: 'tax-advisor'
      working_directory: 'app/tax-advisor'
      function_app_name: 'func-ht-taxb-p-cin-01'
      static_web_app_name: 'stapp-ht-taxb-p-cin-01'
      resource_group: 'rg-ht-taxb-p-cin-01'
      app_subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
      storage_account_name: 'sthttaxbpcin01'
      storage_container_name: 'documents'
      documents_directory: 'app/tax-advisor/documents'
      swa_token_secret_name: 'taxb-swa-deployment-token'
      environment_name: 'tax-advisor-prod'
    secrets: inherit
