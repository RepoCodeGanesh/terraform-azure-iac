# ==============================================================================
# Workflow: App - TaxBot India Application CI/CD (Caller Workflow)
# Pattern: Enterprise Parameterized Reusable Workflow Pattern (Parallelized)
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# Central Template Repo: RepoCodeGanesh/.github
# ==============================================================================

name: App - TaxBot India CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    paths:
      - 'app/tax-advisor/**'
      - '.github/workflows/app-tax-advisor.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/tax-advisor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── JOB 0: DevSecOps SAST & SCA Security Scanning (Phase 1) ────────────────
  devsecops-scan:
    name: DevSecOps SAST & SCA Scan
    uses: RepoCodeGanesh/.github/.github/workflows/app-sec-scan.yml@main
    with:
      working_directory: 'app/tax-advisor'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 1: Deploy Python Backend Function App (Phase 2 - Parallel) ─────────
  deploy-backend:
    name: Deploy Python Function App Backend
    needs: devsecops-scan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-deploy-func.yml@main
    with:
      function_app_name: 'func-ht-taxb-p-cin-01'
      working_directory: 'app/tax-advisor/backend'
      app_subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 2: Build & Deploy React Frontend SPA (Phase 2 - Parallel) ──────────
  deploy-frontend:
    name: Build & Deploy React Frontend
    needs: devsecops-scan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-deploy-swa.yml@main
    with:
      static_web_app_name: 'stapp-ht-taxb-p-cin-01'
      working_directory: 'app/tax-advisor/frontend'
      key_vault_name: 'kv-ht-ss-p-cin-01'
      shared_subscription_id: '859a785c-bd38-402d-b595-1f44f40fb9bf'
      swa_token_secret_name: 'taxb-swa-deployment-token'
    secrets:
      SHARED_CLIENT_ID: ${{ secrets.SHARED_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 3: Upload RAG Documents to Blob Storage (Phase 2 - Parallel) ───────
  upload-documents:
    name: Upload RAG Documents
    needs: devsecops-scan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-sync-docs.yml@main
    with:
      storage_account_name: 'sthttaxbpcin01'
      container_name: 'documents'
      source_directory: 'app/tax-advisor/documents'
      app_subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 4: Configure CORS Origins (Phase 3 - Waits for Frontend & Backend) ─
  configure-cors:
    name: Configure CORS & APIM
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/tags/release/') || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-config-cors.yml@main
    with:
      static_web_app_name: 'stapp-ht-taxb-p-cin-01'
      function_app_name: 'func-ht-taxb-p-cin-01'
      resource_group: 'rg-ht-taxb-p-cin-01'
      app_subscription_id: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # ── JOB 5: Enterprise SemVer Tagging & Release (Phase 4 - Final) ───────────
  create-release:
    name: Enterprise SemVer Release
    needs: [configure-cors, upload-documents]
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/app-tag-semver.yml@main
    with:
      artifact_name: 'taxbot-backend-package'
      release_artifacts: 'functionapp.zip'

  # ── JOB 6: Automated Post-Deployment Synthetic Health Check ─────────────────
  verify-deployment:
    name: 🧪 Automated Synthetic Health Check
    needs: [configure-cors]
    if: always() && needs.configure-cors.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Probe APIM Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://apim-ht-ss-p-cin-01.azure-api.net/tax-advisor/health)
          echo "APIM Gateway /health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error ::APIM Gateway Health check failed with status $STATUS"
            exit 1
          fi

      - name: Probe Frontend Production Web App
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.mytaxbot.site)
          echo "Frontend www.mytaxbot.site status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error ::Frontend check failed with status $STATUS"
            exit 1
          fi
          echo "✅ All Synthetic Post-Deployment Checks Passed!"
