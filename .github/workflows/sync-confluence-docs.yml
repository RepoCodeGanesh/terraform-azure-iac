name: Docs-as-Code - Publish Confluence Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/confluence/**'
      - 'scripts/sync_to_confluence.py'
      - '.github/workflows/sync-confluence-docs.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (validate XHTML conversion without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-publish:
    name: Sync Documentation to Atlassian Confluence
    runs-on: ubuntu-latest
    environment: shared-services-prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Run Markdown to Confluence XHTML Dry-Run Validation
        run: |
          python scripts/sync_to_confluence.py --dry-run

      - name: Azure Login via Workload Identity Federation (WIF OIDC)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SHARED_CLIENT_ID || '580ffcfd-51ee-4dc3-9204-d03cb438ff82' }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || '4cef0d84-84d6-4ed0-8abe-773b015bcf99' }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || '859a785c-bd38-402d-b595-1f44f40fb9bf' }}

      - name: Retrieve Confluence API Token from Shared Key Vault
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: get-token
        run: |
          TOKEN=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name confluence-api-token --subscription 859a785c-bd38-402d-b595-1f44f40fb9bf --query value -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to retrieve confluence-api-token from Key Vault kv-ht-ss-p-cin-01."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CONFLUENCE_API_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Publish All 17 Specifications to Confluence Space HT
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CONFLUENCE_EMAIL: 'richtextforganesh@outlook.com'
        run: |
          python scripts/sync_to_confluence.py

      - name: Generate Publishing Summary
        if: always()
        run: |
          echo "### 📚 Atlassian Confluence Docs-as-Code Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Space** | \`HT\` (HappyTechies Cloud & AI Platform) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Domain** | \`happytechies.atlassian.net\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Specifications** | 17 Architectural Documents |" >> $GITHUB_STEP_SUMMARY
          echo "| **Validation Mode** | ${{ github.event.inputs.dry_run == 'true' && 'Dry-Run (XHTML Validated)' || 'Live Published' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Live Confluence Space HT ↗](https://happytechies.atlassian.net/wiki/spaces/HT/overview)" >> $GITHUB_STEP_SUMMARY
