# ==============================================================================
# Workflow: Platform - Bootstrap IaC (True Level 3 Golden Path)
# Provisions: Central Terraform remote state storage (sthtbootpcin01)
# Target Subscription: Bootstrap (7689ad81-71ba-481b-a17c-e1b6be61bab1)
# Central Standard: RepoCodeGanesh/.github (reusable-tf-workload-pipeline.yml@main)
# ==============================================================================

name: Platform - Bootstrap IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/bootstrap/**'
      - '.github/workflows/platform-bootstrap.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/bootstrap/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  bootstrap-iac:
    name: 🏛️ Bootstrap IaC
    uses: RepoCodeGanesh/.github/.github/workflows/reusable-tf-workload-pipeline.yml@main
    with:
      working_directory: 'platform/bootstrap'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'bootstrap-tfplan'
      soft_fail: true
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
