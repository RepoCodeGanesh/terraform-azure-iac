# ==============================================================================
# Workflow: Platform - Bootstrap IaC (Uses Reusable Templates)
# Provisions: Central Terraform remote state storage (sthtbootpcin01)
# Target Subscription: Bootstrap (7689ad81-71ba-481b-a17c-e1b6be61bab1)
# Rules: PR -> Plan only | push(develop/main) OR workflow_dispatch(any branch) -> Apply
# ==============================================================================

name: Platform - Bootstrap IaC

on:
  push:
    branches: [main, develop]
    paths:
      - 'platform/bootstrap/**'
      - '.github/workflows/platform-bootstrap.yml'
      - '.github/workflows/template-tf-*.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/bootstrap/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/template-tf-plan.yml
    with:
      working_directory: 'platform/bootstrap'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'bootstrap-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push')
    uses: ./.github/workflows/template-tf-apply.yml
    with:
      working_directory: 'platform/bootstrap'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'bootstrap-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
