# ==============================================================================
# Workflow: Platform - Bootstrap IaC (Uses Central Organization Templates)
# Provisions: Central Terraform remote state storage (sthtbootpcin01)
# Target Subscription: Bootstrap (7689ad81-71ba-481b-a17c-e1b6be61bab1)
# Central Template Repo: RepoCodeGanesh/.github
# ==============================================================================

name: Platform - Bootstrap IaC

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['release/*', 'v*']
    paths:
      - 'platform/bootstrap/**'
      - '.github/workflows/platform-bootstrap.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/bootstrap/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    uses: RepoCodeGanesh/.github/.github/workflows/tf-plan.yml@main
    with:
      working_directory: 'platform/bootstrap'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'bootstrap-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push')
    uses: RepoCodeGanesh/.github/.github/workflows/tf-apply.yml@main
    with:
      working_directory: 'platform/bootstrap'
      subscription_id: '7689ad81-71ba-481b-a17c-e1b6be61bab1'
      environment_name: 'bootstrap-prod'
      artifact_name: 'bootstrap-tfplan'
    secrets:
      CLIENT_ID: ${{ secrets.BOOTSTRAP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  summary:
    name: Summary
    needs: [plan, apply]
    if: always() && (needs.apply.result == 'success' || needs.plan.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - run: |
          ACTION="${{ needs.apply.result == 'success' && 'apply' || 'plan' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY

          ### Terraform Azure Landing Zone Summary
          **Target Root:** \`platform/bootstrap\`
          **Action:** \`${ACTION}\`
          **Azure Subscription ID:** \`7689ad81-71ba-481b-a17c-e1b6be61bab1\`
          **Target Environment:** \`bootstrap-prod\`

          | CAF Governance Check | Configuration | Status |
          | :--- | :--- | :--- |
          | **Remote State Backend** | \`sthtbootpcin01\` (Azure AD Auth) | Connected |
          | **State Key** | \`platform/bootstrap/prod.tfstate\` | Isolated |
          | **Workload Identity (WIF)** | Entra ID Federated OIDC | Authenticated |
          | **Cost Policy** | Low-Cost / Free-Tier SKUs Enforced | Verified |

          EOF
