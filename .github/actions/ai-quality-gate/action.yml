name: 'AI Quality & Semantic Regression Gate'
description: 'Runs pytest, Ragas triad evals, and 9-case regulatory redline semantic suite'

inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.11'
  working-directory:
    description: 'Working directory for backend tests'
    required: false
    default: 'app/bank-compliance'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: 'app/bank-compliance/backend/requirements.txt'

    - name: Install Evaluation Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r app/bank-compliance/backend/requirements.txt
        pip install pytest pytest-asyncio

    - name: Run Redline Semantic Regression Test Suite
      shell: bash
      env:
        MOCK_INFERENCE: "true"
        ENVIRONMENT: "ci"
      run: |
        echo "► Running 9-case Redline Semantic Regression Suite (negation, unlisted nations, mathematical scoring)..."
        python -m pytest app/bank-compliance/backend/test_redline_semantic_suite.py -v

    - name: Run Synthetic Triad & Groundedness Evals
      shell: bash
      env:
        MOCK_INFERENCE: "true"
        ENVIRONMENT: "ci"
      run: |
        echo "► Running RAG Groundedness & Compliance Evaluation Suite..."
        python -m pytest app/bank-compliance/eval/test_eval_pipeline.py -v
