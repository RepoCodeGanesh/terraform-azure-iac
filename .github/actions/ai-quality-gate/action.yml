name: 'AI Quality & Semantic Regression Gate'
description: 'Runs GenAIOps evaluations, PyRIT benchmarks, and the 9-case redline semantic test suite'

inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.11'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run GenAIOps Regression & Cost Evaluation
      shell: bash
      run: |
        python app/bank-compliance/eval/evaluate.py --mode fast --max-cost 0.05

    - name: Run PyRIT Adversarial Red Team Attack Benchmark
      shell: bash
      run: |
        python app/bank-compliance/eval/redteam_suite.py

    - name: Run 8-Task Enterprise AI Platform Test Suite
      shell: bash
      run: |
        python app/bank-compliance/backend/test_all_8_tasks_suite.py

    - name: Run 2026/2027 Frontier Test Suite (GraphRAG, MCP, Dossier)
      shell: bash
      run: |
        python app/bank-compliance/backend/test_2026_frontier_suite.py

    - name: Run Policy & Contract Redline Semantic Test Suite
      shell: bash
      run: |
        python app/bank-compliance/backend/test_redline_semantic_suite.py

    - name: Run Frontend UI Integrity & Component Test Suite
      shell: bash
      run: |
        python app/bank-compliance/frontend/test_ui_contract.py
