# ==============================================================================
# Workflow: BankCompliance AI — AI Quality Evaluation
# Runs on every PR to main/develop to gate deployment on RAG quality scores.
# Uses Azure AI Evaluation SDK to score: Groundedness, Relevance, Fluency.
# Blocks merge if any metric falls below the defined threshold.
# ==============================================================================

name: "AI Quality Evaluation — BankCompliance RAG"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/bank-compliance/backend/**'
      - 'app/bank-compliance/eval/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ai-evaluation:
    name: "RAG Quality Gate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bank-compliance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app/bank-compliance/eval/requirements-eval.txt'

      - name: Install Evaluation Dependencies
        run: pip install -r eval/requirements-eval.txt

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure OpenAI Token (Keyless Auth)
        run: |
          # Get an access token for Azure OpenAI using the managed identity (WIF)
          # No API keys needed — uses the same WIF pattern as the rest of the repo
          TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)
          echo "OPENAI_API_KEY=$TOKEN" >> $GITHUB_ENV

      - name: Run AI Quality Evaluation
        env:
          AZURE_OPENAI_ENDPOINT:    ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT:  "gpt-5.4-nano"
          LITELLM_URL:              "http://localhost:4000/v1"
        run: python eval/evaluate.py

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-results
          path: app/bank-compliance/eval/eval_results.json
          retention-days: 30
