# ==============================================================================
# BankCompliance AI — Helm Chart Default Values
# ==============================================================================

# Global / Shared
namespace: bank-compliance

# Workload Identity Service Account
serviceAccount:
  create: true
  name: bankc-sa
  clientId: "cb1ac815-1dac-4af3-bce8-5976d93d1cb8"

# FastAPI Backend
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/repocodeganesh/bank-compliance-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    altPort: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 2m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    contentSafetyEndpoint: "https://cs-ht-ss-p-sea-01.cognitiveservices.azure.com/"
    litellmUrl: "http://litellm:4000/v1"
    openaiModel: "gemini-2.0-flash"
    qdrantHost: "qdrant"
    qdrantPort: "6333"
    qdrantCollection: "rbi_master_directions"
    allowedOrigins: "https://orange-forest-082ced70f.5.azurestaticapps.net,https://bank.mytaxbot.site,http://bank.mytaxbot.site,http://localhost:3000,http://localhost:8000,*"
    environment: "production"
    langfuseHost: "https://cloud.langfuse.com"
    langfuseTracingEnabled: "true"
    dailyTokenBudget: "500000"

# Internal FastMCP regulatory-search service
mcp:
  replicaCount: 1
  serverUrl: "http://bankc-mcp-server:8080/sse"
  resources:
    requests:
      cpu: 5m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 200Mi

# LiteLLM AI Gateway Proxy
litellm:
  replicaCount: 1
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-v1.57.4  # v1.41.0 had prometheus NoneType callback bug — fixed in v1.57.4+
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  resources:
    requests:
      cpu: 2m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 300Mi

# Secrets (Injected dynamically by CI/CD via --set or secret ref)
secrets:
  openaiEndpoint: ""
  openaiKey: ""
  geminiApiKey: ""
  groqApiKey: ""
