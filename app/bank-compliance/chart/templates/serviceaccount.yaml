{{- if .Values.serviceAccount.create -}}
{{/*
Azure Workload Identity Federation (WIF) ServiceAccount
Binds Kubernetes ServiceAccount to Azure Managed Identity (UAMI) for passwordless auth.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Binds pod to Azure User-Assigned Managed Identity Client ID
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/name: {{ include "bank-compliance.name" . }}-sa
    {{- include "bank-compliance.labels" . | nindent 4 }}
{{- end }}
