{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bankc-backend-scaler
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "bank-compliance.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: bankc-backend
  minReplicaCount: {{ .Values.keda.backend.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.backend.maxReplicaCount | default 5 }}
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: litellm-proxy-scaler
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "bank-compliance.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: litellm-proxy
  minReplicaCount: {{ .Values.keda.litellm.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.litellm.maxReplicaCount | default 3 }}
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
{{- end }}
