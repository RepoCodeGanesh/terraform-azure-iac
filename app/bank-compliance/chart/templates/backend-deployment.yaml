# ==============================================================================
# BankCompliance AI Backend Deployment (FastAPI Application)
# Key Features:
#   - Azure Workload Identity: Passwordless Entra ID auth to Key Vault & Azure OpenAI
#   - Prometheus Scraping: Auto-scraped on port 8000 (/metrics) for Grafana dashboards
#   - Zero-Downtime Probes: Liveness and Readiness probes against /healthz
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankc-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: bankc-backend
    app.kubernetes.io/name: {{ include "bank-compliance.name" . }}-backend
    {{- include "bank-compliance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: bankc-backend
  template:
    metadata:
      labels:
        app: bankc-backend
        # Injects Azure federated identity tokens into pod env
        azure.workload.identity/use: "true"
      annotations:
        # Automated Prometheus telemetry scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bankc-backend-config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Liveness Probe: Restarts container if deadlock occurs
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          # Readiness Probe: Routes traffic only after model corpus is loaded
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
