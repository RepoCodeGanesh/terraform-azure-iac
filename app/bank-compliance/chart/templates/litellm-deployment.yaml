apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: litellm-proxy
    {{- include "bank-compliance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.litellm.replicaCount }}
  selector:
    matchLabels:
      app: litellm-proxy
  # Zero-downtime rolling update: new pod must be healthy before old pod is removed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: litellm-proxy
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
        # Force pod restart when ConfigMap changes (model routing updated)
        checksum/config: {{ include (print $.Template.BasePath "/litellm-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # 60s grace — in-flight LLM calls (Gemini/Azure) can take up to 30s
      terminationGracePeriodSeconds: 60
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          envFrom:
            - secretRef:
                name: litellm-secret
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.litellm.service.port }}
              name: http
          # Liveness: if LiteLLM process hangs — restart it
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: only route traffic when models are initialized
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config

