apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-compliance.labels" . | nindent 4 }}
data:
  config.yaml: |
    # ==============================================================================
    # LiteLLM Multi-Model & Multi-Vendor Routing Configuration
    # Architecture:
    #   - Primary Fleet: Google Gemini 2.0 / Groq LPU ($0.00 idle cost, 500+ tok/s)
    #   - Enterprise Fallback: Microsoft Azure OpenAI Service (gpt-5.4-nano)
    # ==============================================================================
    model_list:
      # ── 1. Ultra-Fast High-Throughput Model: Groq LPU (500+ tok/s) ───────────
      - model_name: groq-llama-70b
        litellm_params:
          model: groq/openai/gpt-oss-120b
          api_key: "os.environ/GROQ_API_KEY"

      # ── 2. Specialist Fast Classifier: Groq LPU (Sub-30ms) ───────────────────
      - model_name: groq-llama-8b
        litellm_params:
          model: groq/openai/gpt-oss-20b
          api_key: "os.environ/GROQ_API_KEY"

      # ── 3. Primary Context Model: Google Gemini 2.0 Flash ────────────────────
      - model_name: gemini-2.0-flash
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: "os.environ/GEMINI_API_KEY"

      # ── 4. Specialist Model: Google Gemini 2.0 Flash-Lite (Sub-50ms) ─────────
      - model_name: gemini-2.0-flash-lite
        litellm_params:
          model: gemini/gemini-2.0-flash-lite
          api_key: "os.environ/GEMINI_API_KEY"

      # ── 5. Complex Model: Google Gemini 2.0 Flash ────────────────────────────
      - model_name: gemini-2.0-flash-thinking
        litellm_params:
          model: gemini/gemini-2.0-flash
          api_key: "os.environ/GEMINI_API_KEY"

      # ── 6. Cross-Cloud Fallback: Microsoft Azure OpenAI Service ───────────────
      - model_name: gpt-5.4-nano
        litellm_params:
          model: azure/gpt-5.4-nano
          api_base: "os.environ/AZURE_OPENAI_ENDPOINT"
          api_key: "os.environ/AZURE_API_KEY"
          api_version: "2024-06-01"

    # ── KV Prompt Caching for Latency & Token Optimization ───────────────────────
    general_settings:
      enable_prompt_caching: true
      cache_type: "in-memory"
      cache_ttl: 7200

    # ── Intelligent Multi-Tier Routing & Circuit Breaking ────────────────────────
    router_settings:
      routing_strategy: "least-busy"
      num_retries: 3
      timeout: 30
      fallbacks:
        - gemini-2.0-flash: ["groq-llama-70b", "gpt-5.4-nano"]
        - groq-llama-70b: ["gemini-2.0-flash", "gpt-5.4-nano"]
        - gemini-2.0-flash-lite: ["groq-llama-8b", "gemini-2.0-flash", "gpt-5.4-nano"]
        - gemini-2.0-flash-thinking: ["groq-llama-70b", "gemini-2.0-flash", "gpt-5.4-nano"]
