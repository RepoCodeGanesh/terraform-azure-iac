# ==============================================================================
# BankCompliance AI — Azure Workload Identity ServiceAccount
# Binds this Kubernetes ServiceAccount to the Azure User-Assigned Managed Identity
# (uami-ht-bankc-p-cin-01) for passwordless authentication to Azure Key Vault & OpenAI.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bankc-sa
  namespace: bank-compliance
  annotations:
    # Client ID of the User-Assigned Managed Identity created by Terraform
    azure.workload.identity/client-id: "0db122a8-1966-4955-8c97-74f1b540ca45"
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/name: bank-compliance-sa
