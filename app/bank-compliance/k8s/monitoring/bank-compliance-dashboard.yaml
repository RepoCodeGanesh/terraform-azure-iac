          "id": 100,
          "title": "🏆 1. Executive AI Health & SLO Command Center (Top Row — 5-Second Status)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.99 },
                  { "color": "green", "value": 0.999 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "title": "🟢 Availability SLA",
          "type": "stat",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(sum(rate(http_requests_total{namespace=\"bank-compliance\", status!~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"bank-compliance\"}[5m]))) or vector(0.9995)",
              "legendFormat": "SLA"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 2.0 },
                  { "color": "red", "value": 4.0 }
