apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bankc-backend-monitor
  namespace: bank-compliance
  labels:
    release: monitoring
    app: bankc-backend
spec:
  selector:
    matchLabels:
      app: bankc-backend
  endpoints:
    - port: http-alt
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy-monitor
  namespace: bank-compliance
  labels:
    release: monitoring
    app: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
