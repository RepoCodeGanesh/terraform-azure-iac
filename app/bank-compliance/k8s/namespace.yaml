# ==============================================================================
# BankCompliance AI — Dedicated Kubernetes Namespace
# Isolates BankCompliance AI compute workloads, RBAC policies, network policies,
# and secret stores from other applications hosted on the shared AKS cluster.
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: bank-compliance
  labels:
    name: bank-compliance
    app.kubernetes.io/part-of: bank-compliance-ai
