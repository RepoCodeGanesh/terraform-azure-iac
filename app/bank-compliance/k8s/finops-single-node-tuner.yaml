# ==============================================================================
# FinOps Single-Node AKS Optimizer & Disk/CPU Reconciler
#
# Pillars:
# 1. CPU Management (Deployment):
#    - Continuously pins managed system add-ons (Gatekeeper, KEDA, Metrics Server,
#      Workload Identity Webhook) to 1 replica every 120s.
#    - Instantly reconciles on cluster boot within 5 seconds.
#    - Automatically detects and deletes Evicted / Failed pods across all namespaces.
#
# 2. Disk Management (CronJob):
#    - Runs every 2 hours to prune dangling/unused container images via crictl.
#    - Prevents 30GB OS disk from exceeding 85% threshold, preventing Kubelet
#      DiskPressure taints and pod evictions with $0 extra spend.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-single-node-tuner-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-single-node-tuner-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-single-node-tuner-binding
subjects:
- kind: ServiceAccount
  name: finops-single-node-tuner-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: finops-single-node-tuner-role
  apiGroup: rbac.authorization.k8s.io
---
# ─── 1. Continuous CPU & Evicted Pod Reconciler (Deployment) ───────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-single-node-tuner
  namespace: kube-system
  labels:
    app.kubernetes.io/name: finops-single-node-tuner
    app.kubernetes.io/part-of: happytechies-finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-single-node-tuner
  template:
    metadata:
      labels:
        app: finops-single-node-tuner
    spec:
      serviceAccountName: finops-single-node-tuner-sa
      containers:
      - name: tuner
        image: ghcr.io/repocodeganesh/bank-compliance-backend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 1m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        command: ["python", "-c"]
        args:
        - |
          import urllib.request, ssl, json, time, os

          targets = [
              ('gatekeeper-system', 'gatekeeper-controller'),
              ('kube-system', 'keda-operator'),
              ('kube-system', 'keda-operator-metrics-apiserver'),
              ('kube-system', 'keda-admission-webhooks'),
              ('kube-system', 'azure-wi-webhook-controller-manager'),
              ('kube-system', 'metrics-server')
          ]

          print("=== FinOps Continuous Single-Node Tuner Started ===", flush=True)
          while True:
              try:
                  token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
                  headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/merge-patch+json'}
                  ctx = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')

                  # 1. Scale redundant HA deployments to 1 replica
                  for ns, dep in targets:
                      # Try scale subresource first
                      url = f'https://kubernetes.default.svc/apis/apps/v1/namespaces/{ns}/deployments/{dep}/scale'
                      req = urllib.request.Request(url, data=b'{"spec":{"replicas":1}}', headers=headers, method='PATCH')
                      try:
                          with urllib.request.urlopen(req, context=ctx) as resp:
                              print(f"[TUNER] Scaled {ns}/{dep} via /scale -> 1", flush=True)
                              continue
                      except Exception as e:
                          pass

                      # Fallback: direct deployment patch
                      dep_url = f'https://kubernetes.default.svc/apis/apps/v1/namespaces/{ns}/deployments/{dep}'
                      dep_req = urllib.request.Request(dep_url, data=b'{"spec":{"replicas":1}}', headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/strategic-merge-patch+json'}, method='PATCH')
                      try:
                          with urllib.request.urlopen(dep_req, context=ctx) as resp:
                              print(f"[TUNER] Scaled {ns}/{dep} via /deployments -> 1", flush=True)
                      except Exception as err:
                          print(f"[TUNER SCALE ERR] {ns}/{dep}: {err}", flush=True)

                  # 2. Automatically delete any Failed or Evicted pods
                  get_headers = {'Authorization': f'Bearer {token}'}
                  pods_url = 'https://kubernetes.default.svc/api/v1/pods?fieldSelector=status.phase=Failed'
                  pods_req = urllib.request.Request(pods_url, headers=get_headers)
                  with urllib.request.urlopen(pods_req, context=ctx) as resp:
                      data = json.loads(resp.read().decode())
                      for pod in data.get('items', []):
                          p_ns = pod['metadata']['namespace']
                          p_name = pod['metadata']['name']
                          del_url = f'https://kubernetes.default.svc/api/v1/namespaces/{p_ns}/pods/{p_name}'
                          del_req = urllib.request.Request(del_url, headers=get_headers, method='DELETE')
                          try:
                              urllib.request.urlopen(del_req, context=ctx)
                              print(f"[CLEANUP] Purged failed/evicted pod {p_ns}/{p_name}", flush=True)
                          except Exception:
                              pass
              except Exception as err:
                  print(f"[RECONCILE ERROR] {err}", flush=True)

              time.sleep(15)
---
# ─── 2. Scheduled Container Image Pruner (CronJob) ────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-disk-cleaner
  namespace: kube-system
  labels:
    app.kubernetes.io/name: finops-disk-cleaner
    app.kubernetes.io/part-of: happytechies-finops
spec:
  schedule: "0 */1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: finops-disk-cleaner
        spec:
          hostPID: true
          restartPolicy: OnFailure
          containers:
          - name: pruner
            image: mcr.microsoft.com/cbl-mariner/base/core:2.0
            imagePullPolicy: IfNotPresent
            command: ["chroot", "/host", "/usr/bin/crictl", "rmi", "--prune"]
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
            volumeMounts:
            - name: host-root
              mountPath: /host
          volumes:
          - name: host-root
            hostPath:
              path: /
