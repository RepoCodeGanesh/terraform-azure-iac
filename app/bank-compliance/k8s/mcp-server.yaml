apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankc-mcp-server
  namespace: bank-compliance
  labels:
    app: bankc-mcp-server
    app.kubernetes.io/name: bankc-mcp-server
    app.kubernetes.io/part-of: bank-compliance-ai
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bankc-mcp-server
  template:
    metadata:
      labels:
        app: bankc-mcp-server
        app.kubernetes.io/part-of: bank-compliance-ai
    spec:
      serviceAccountName: bankc-sa
      containers:
        - name: mcp-server
          image: ghcr.io/repocodeganesh/bank-compliance-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.services.mcp_server"]
          env:
            - name: MCP_TRANSPORT
              value: "sse"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: mcp
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bankc-backend-config
            - secretRef:
                name: bankc-langfuse-secret
                optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bankc-mcp-server
  namespace: bank-compliance
  labels:
    app: bankc-mcp-server
    app.kubernetes.io/part-of: bank-compliance-ai
  annotations:
    skill-bridge/access: "cluster-internal-only"
spec:
  type: ClusterIP
  selector:
    app: bankc-mcp-server
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
      protocol: TCP
