# ==============================================================================
# BankCompliance AI — Qdrant Vector Database StatefulSet
# Storage: 4Gi Azure Managed CSI Disk for persistent vector indices
# ==============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: bank-compliance
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      # 60s grace period — allows Qdrant to flush WAL (write-ahead log) before shutdown
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoExecute"
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          resources:
            requests:
              cpu: "10m"       # Tuned down from 100m — fits on single B2ms node
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # Liveness: restart if Qdrant process crashes or corrupts internal state
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Readiness: only route queries when vector index is fully loaded from disk
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "managed-csi-tagged"
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: bank-compliance
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334

