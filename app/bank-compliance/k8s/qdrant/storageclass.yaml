# ==============================================================================
# BankCompliance AI — Policy-Compliant StorageClass for CSI Managed Disks
# Injects required enterprise governance tags (Environment, ManagedBy, Project)
# to satisfy Root Management Group Azure Policies.
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi-tagged
provisioner: disk.csi.azure.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  skuName: StandardSSD_LRS
  tags: "Environment=p,ManagedBy=Terraform,Project=ht,Workload=bankc,Company=HappyTechies"
