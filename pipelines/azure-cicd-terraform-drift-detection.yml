# ==============================================================================
# Pipeline: Azure DevOps - Multi-Root Terraform Drift Detection
# Schedule: Runs daily at 02:00 UTC (07:30 IST) or on manual run
# Target Roots:
#   1. platform/bootstrap (Service Connection: bootstrap)
#   2. platform/hub (Service Connection: hub-prod)
#   3. platform/shared-services (Service Connection: shared-services)
#   4. workloads/tax-advisor (Service Connection: app-prod)
#   5. workloads/bank-compliance-ai-aks (Service Connection: app-prod)
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-terraform-drift-detection

trigger: none
pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: "Daily 02:00 UTC Drift Detection"
    branches:
      include:
        - main
    always: true

parameters:
  - name: targetRoot
    displayName: "Target Terraform Root"
    type: string
    default: "all"
    values:
      - "all"
      - "platform/bootstrap"
      - "platform/hub"
      - "platform/shared-services"
      - "workloads/tax-advisor"
      - "workloads/bank-compliance-ai-aks"

variables:
  TERRAFORM_VERSION: "1.9.0"
  VM_IMAGE: "ubuntu-latest"

stages:
  # ── 1. Bootstrap Root ────────────────────────────────────────────────────────
  - stage: DriftBootstrap
    displayName: "1. Drift Check: platform/bootstrap"
    condition: or(eq('${{ parameters.targetRoot }}', 'all'), eq('${{ parameters.targetRoot }}', 'platform/bootstrap'))
    jobs:
      - job: CheckBootstrapDrift
        pool:
          vmImage: $(VM_IMAGE)
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TERRAFORM_VERSION)
          - task: AzureCLI@2
            inputs:
              azureSubscription: "bootstrap"
              addSpnToEnvironment: true
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                cd platform/bootstrap
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_ID_TOKEN=$idToken
                terraform init -reconfigure -backend-config=backend.hcl -input=false
                
                VAR_ARG=""
                if [ -f "prod.tfvars" ]; then
                  VAR_ARG="-var-file=prod.tfvars"
                fi
                
                set +e
                terraform plan -detailed-exitcode -no-color $VAR_ARG > plan_output.txt 2>&1
                EXIT_CODE=$?
                set -e
                
                if [ $EXIT_CODE -eq 0 ]; then
                  echo "No drift detected in platform/bootstrap."
                elif [ $EXIT_CODE -eq 2 ]; then
                  echo "##vso[task.logissue type=warning]Drift detected in platform/bootstrap"
                  cat plan_output.txt
                else
                  echo "##vso[task.logissue type=error]Terraform execution error in platform/bootstrap"
                  cat plan_output.txt
                  exit 1
                fi
            displayName: "Run Terraform Plan (Drift Check)"

  # ── 2. Hub-prod Root ─────────────────────────────────────────────────────────
