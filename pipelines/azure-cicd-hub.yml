trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - platform/hub/**
      - pipelines/azure-cicd-hub.yml
    exclude:
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - platform/hub/**
      - pipelines/azure-cicd-hub.yml
    exclude:
      - '**/*.md'

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: azureServiceConnection
    value: 'hub-prod'

  - name: workingDirectory
    value: 'platform/hub'


pool:
  vmImage: ubuntu-latest

stages:

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    environmentName: 'hub-prod'
