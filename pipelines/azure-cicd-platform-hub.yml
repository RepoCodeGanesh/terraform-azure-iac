# ==============================================================================
# Pipeline Name: Azure Platform - Hub Network IaC CI/CD Pipeline
# Description: Provisions Hub VNet (vnet-ht-hub-p-cin-01) & Central Firewall/Routing
# Target Subscription: Hub-prod (3eb8cc01-50c6-473e-8d5f-f8d532ae1f5b)
# ==============================================================================

name: Platform-HubNetwork-IaC-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven CI.
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - platform/hub/**
#       - pipelines/azure-cicd-hub.yml
#     exclude:
#       - '**/*.md'

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven PR checks.
pr: none
# pr:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - platform/hub/**
#       - pipelines/azure-cicd-hub.yml
#     exclude:
#       - '**/*.md'

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: azureServiceConnection
    value: 'hub-prod'

  - name: workingDirectory
    value: 'platform/hub'

pool:
  vmImage: ubuntu-latest
  # name: local  # self-hosted agent pool

stages:

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    environmentName: 'hub-prod'
