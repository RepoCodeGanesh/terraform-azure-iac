# ==============================================================================
# Pipeline Name: TaxBot India - Infrastructure IaC CI/CD Pipeline
# Description: Provisions Azure AI Landing Zone infrastructure for TaxBot India
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: TaxBot-India-IaC-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven CI.
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - workloads/tax-advisor/**
#       - pipelines/azure-cicd-tax-advisor.yml
#     exclude:
#       - '**/*.md'

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven PR checks.
pr: none
# pr:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - workloads/tax-advisor/**
#       - pipelines/azure-cicd-tax-advisor.yml
#     exclude:
#       - '**/*.md'

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: azureServiceConnection
    value: 'app-prod'

  - name: workingDirectory
    value: 'workloads/tax-advisor'

pool:
  vmImage: ubuntu-latest
  # name: local  # self-hosted agent pool

stages:

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    environmentName: 'tax-advisor-prod'
