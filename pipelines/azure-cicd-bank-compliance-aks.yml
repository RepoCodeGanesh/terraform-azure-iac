# ==============================================================================
# Pipeline Name: BankCompliance AI - Infrastructure IaC CI/CD Pipeline
# Description: Provisions AKS Free Tier & AI Landing Zone infrastructure for BankCompliance AI
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: BankCompliance-AI-IaC-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

# Disabled â€” GHA owns push/PR triggers. Uncomment to revert to ADO-driven CI.
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - workloads/bank-compliance-ai-aks/**
#       - pipelines/azure-cicd-bank-compliance-aks.yml
#     exclude:
#       - '**/*.md'

# Disabled â€” GHA owns push/PR triggers. Uncomment to revert to ADO-driven PR checks.
pr: none
# pr:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - workloads/bank-compliance-ai-aks/**
#       - pipelines/azure-cicd-bank-compliance-aks.yml
#     exclude:
#       - '**/*.md'

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: azureServiceConnection
    value: 'app-prod'

  - name: workingDirectory
    value: 'workloads/bank-compliance-ai-aks'

pool:
  vmImage: ubuntu-latest

stages:

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    environmentName: 'bank-compliance-prod'

