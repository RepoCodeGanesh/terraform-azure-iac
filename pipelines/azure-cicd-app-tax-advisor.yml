trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - app/tax-advisor/**
      - pipelines/azure-cicd-app-tax-advisor.yml
    exclude:
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - app/tax-advisor/**
      - pipelines/azure-cicd-app-tax-advisor.yml
    exclude:
      - '**/*.md'

variables:
  - name: azureServiceConnection
    value: 'app-prod'
  - name: keyVaultName
    value: 'kv-ht-ss-p-cin-01'
  - name: keyVaultSubscription
    value: '859a785c-bd38-402d-b595-1f44f40fb9bf'
  - name: functionAppName
    value: 'func-ht-taxb-p-cin-01'
  - name: resourceGroup
    value: 'rg-ht-taxb-p-cin-01'
  - name: storageAccount
    value: 'sthtaxbpcin01'

pool:
  vmImage: ubuntu-latest

stages:

- stage: DeployFrontend
  displayName: 'Build and Deploy React Frontend'
  jobs:
  - job: BuildAndDeployFrontend
    displayName: 'Deploy React UI to Azure Static Web App'
    steps:
    - task: AzureCLI@2
      displayName: 'Fetch SWA Deployment Token from Key Vault'
      inputs:
        azureSubscription: 'shared-services'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          TOKEN=$(az keyvault secret show \
            --vault-name "$(keyVaultName)" \
            --name "SWA-TAXB-DEPLOYMENT-TOKEN" \
            --subscription "$(keyVaultSubscription)" \
            --query "value" -o tsv 2>/dev/null || echo "")
          echo "##vso[task.setvariable variable=SWA_CLI_DEPLOYMENT_TOKEN;issecret=true]$TOKEN"

    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        cd app/tax-advisor/frontend
        npm install
        npm run build
      displayName: 'Build React UI'

    - task: AzureStaticWebApp@0
      inputs:
        app_location: 'app/tax-advisor/frontend'
        output_location: 'dist'
        azure_static_web_apps_api_token: '$(SWA_CLI_DEPLOYMENT_TOKEN)'
      displayName: 'Deploy to Static Web App'

- stage: DeployBackend
  displayName: 'Deploy Python Function App'
  jobs:
  - job: BuildAndDeployBackend
    displayName: 'Package and Deploy Python Code'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Use Python 3.11'

    - script: |
        cd app/tax-advisor/backend
        python -m venv .venv
        source .venv/bin/activate
        pip install --target=".python_packages/lib/site-packages" -r requirements.txt
      displayName: 'Install Python Dependencies'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'app/tax-advisor/backend'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
      displayName: 'Archive Function App Code'

    - task: AzureFunctionApp@2
      inputs:
        connectedServiceNameARM: '$(azureServiceConnection)'
        appType: 'functionAppLinux'
        appName: '$(functionAppName)'
        package: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
        deploymentMethod: 'zipDeploy'
      displayName: 'Deploy to Azure Function App'

- stage: UploadDocuments
  displayName: 'Upload RAG Tax Documents'
  jobs:
  - job: UploadTaxDocs
    displayName: 'Upload Documents to Azure Blob Storage'
    steps:
    - task: AzureCLI@2
      displayName: 'Upload text files to storage container'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az storage blob upload-batch \
            --account-name "$(storageAccount)" \
            --destination "documents" \
            --source "app/tax-advisor/documents" \
            --pattern "*.txt" \
            --auth-mode login \
            --overwrite true

- stage: ApimRegistration
  displayName: 'APIM Registration & Policy Sync'
  jobs:
  - job: RegisterWithApim
    displayName: 'Register TaxBot API with Shared APIM'
    steps:
    - task: AzureCLI@2
      displayName: 'Ensure APIM Policy & Health Endpoints'
      inputs:
        azureSubscription: 'shared-services'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Syncing TaxBot API endpoints in APIM..."
          SWA_URL=$(az staticwebapp show --name stapp-ht-taxb-p-cin-01 --resource-group $(resourceGroup) --query "defaultHostName" -o tsv 2>/dev/null || echo "")
          echo "SWA URL is https://${SWA_URL}"
