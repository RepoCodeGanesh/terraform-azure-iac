# ==============================================================================
# Pipeline Name: DevOnboard AI - Infrastructure IaC CI/CD Pipeline
# Description: Provisions Azure AI Landing Zone infrastructure for DevOnboard AI
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: DevOnboard-AI-IaC-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - workloads/ai-assistant/**
      - pipelines/azure-cicd-ai-assistant.yml
    exclude:
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - workloads/ai-assistant/**
      - pipelines/azure-cicd-ai-assistant.yml
    exclude:
      - '**/*.md'

variables:
  - name: terraformVersion
    value: '1.15.8'

  - name: azureServiceConnection
    value: 'app-prod'

  - name: workingDirectory
    value: 'workloads/ai-assistant'

pool:
  vmImage: ubuntu-latest

stages:

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    environmentName: 'ai-assistant-prod'
