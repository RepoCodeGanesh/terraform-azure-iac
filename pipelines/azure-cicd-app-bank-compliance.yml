# ==============================================================================
# Pipeline Name: BankCompliance AI - Application CI/CD Pipeline
# Description: DevSecOps scanning, GenAIOps AI Quality Evaluation Gate,
#              Docker container build, Helm AKS deployment & Static Web App deploy
# Strategy: GitHub Actions is MASTER/PRIMARY. This Azure DevOps pipeline mirrors
#           the exact same stages, quality gates, and Helm deployment mechanics.
# Stages: 0. DevSecOpsScan | 1. AIEvalQualityGate | 2. BuildBackend | 3. DeployAKS | 4. DeployFrontend
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: BankCompliance-AI-App-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

# Disabled — GitHub Actions owns active push/PR triggers. Uncomment to revert to ADO-driven CI.
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - app/bank-compliance/**
#       - pipelines/azure-cicd-app-bank-compliance.yml
#     exclude:
#       - '**/*.md'

# Disabled — GitHub Actions owns active push/PR triggers. Uncomment to revert to ADO-driven PR checks.
pr: none
# pr:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - app/bank-compliance/**
#       - pipelines/azure-cicd-app-bank-compliance.yml
#     exclude:
#       - '**/*.md'

parameters:
  - name: deployTarget
    displayName: 'Deployment Target'
    type: string
    default: 'all'
    values:
      - 'all'
      - 'frontend-only'
      - 'backend-only'

variables:
  - name: azureServiceConnection
    value: 'app-prod'
  - name: aksClusterName
    value: 'aks-ht-bankc-p-cin-01'
  - name: staticWebAppName
    value: 'stapp-ht-bankc-p-cin-01'
  - name: resourceGroup
    value: 'rg-ht-bankc-p-cin-01'
  - name: subscriptionId
    value: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

pool:
  vmImage: ubuntu-latest

stages:

# ── STAGE 0: Selective Path Change Detection ─────────────────────────────────
- stage: DetectChanges
  displayName: 'Detect Changed Components'
  jobs:
  - job: EvaluateDiff
    displayName: 'Evaluate Changed Paths & Target'
    steps:
    - checkout: self
      fetchDepth: 2
    - bash: |
        TARGET="${{ parameters.deployTarget }}"
        echo "Selected deployment target: $TARGET"
        echo "Build Reason: $(Build.Reason)"

        if [ "$TARGET" = "frontend-only" ]; then
          BACKEND_CHANGED="false"
          FRONTEND_CHANGED="true"
        elif [ "$TARGET" = "backend-only" ]; then
          BACKEND_CHANGED="true"
          FRONTEND_CHANGED="false"
        elif [ "$TARGET" = "all" ]; then
          BACKEND_CHANGED="true"
          FRONTEND_CHANGED="true"
        else
          # Automatic CI trigger: evaluate git diff against HEAD~1
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            DIFF_FILES=$(git log -1 --name-only --pretty="")
          fi
          echo "Changed files in commit:"
          echo "$DIFF_FILES"

          BACKEND_CHANGED="false"
          FRONTEND_CHANGED="false"

          if echo "$DIFF_FILES" | grep -qE "^app/bank-compliance/(backend|k8s|chart|eval)/|^pipelines/azure-cicd-app-bank-compliance\.yml"; then
            BACKEND_CHANGED="true"
          fi

          if echo "$DIFF_FILES" | grep -qE "^app/bank-compliance/frontend/|^pipelines/azure-cicd-app-bank-compliance\.yml"; then
            FRONTEND_CHANGED="true"
          fi
        fi

        echo "##vso[task.setvariable variable=backendChanged;isOutput=true]$BACKEND_CHANGED"
        echo "##vso[task.setvariable variable=frontendChanged;isOutput=true]$FRONTEND_CHANGED"
        echo "Result: backendChanged=$BACKEND_CHANGED, frontendChanged=$FRONTEND_CHANGED"
      name: setVars
      displayName: 'Compute Component Flags'

# ── STAGE 1: DevSecOps SAST & SCA Security Scanning ──────────────────────────
- stage: DevSecOpsScan
  displayName: '1. DevSecOps SAST & SCA Security Scan'
  dependsOn: DetectChanges
  jobs:
  - job: SecurityScan
    displayName: 'Execute SAST, Dependency SCA & SonarCloud Scan'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Use Python 3.11'

    - script: |
        echo "Installing DevSecOps security scanners (Bandit & pip-audit)..."
        pip install bandit pip-audit
        echo "Executing Bandit SAST code security scan on backend..."
        bandit -r app/bank-compliance/backend -ll -ii || echo "Bandit SAST scan completed with advisory notes."
        echo "Executing pip-audit dependency vulnerability scan..."
        pip-audit -r app/bank-compliance/backend/requirements.txt || echo "Dependency SCA scan completed."
      displayName: 'Python SAST & Dependency Vulnerability Scan (Bandit & pip-audit)'

    - task: UseNode@1
      inputs:
        version: '22.x'
      displayName: 'Install Node.js 22.x'

    - script: |
        cd app/bank-compliance/frontend
        echo "Executing npm audit for frontend package dependencies..."
        npm audit --audit-level=high || echo "Frontend npm audit completed with advisory notes."
      displayName: 'Frontend Dependency Vulnerability Scan (npm audit)'

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: 'SonarCloud'
        organization: 'repocodeganesh'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'RepoCodeGanesh_terraform-azure-iac'
        cliProjectName: 'terraform-azure-iac'
        cliSources: 'app/bank-compliance'
      displayName: 'Prepare Enterprise SonarCloud Analysis'

    - task: SonarCloudAnalyze@4
      displayName: 'Execute Enterprise SonarCloud SAST Security Scan'

# ── STAGE 2: Continuous AI Quality & Regression Evaluation Gate ──────────────
- stage: AIEvalQualityGate
  displayName: '2. AI Quality & Regression Evaluation Gate'
  dependsOn: [DetectChanges, DevSecOpsScan]
  condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['EvaluateDiff.setVars.backendChanged'], 'true'))
  jobs:
  - job: RunEvaluation
    displayName: 'Evaluate RAG Groundedness, Citation & Security'
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Use Python 3.11'

    - script: |
        python app/bank-compliance/eval/evaluate.py
      displayName: 'Execute Golden Dataset Evaluation Gate'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'app/bank-compliance/eval/eval_results.json'
        ArtifactName: 'genaiops-quality-scorecard'
        publishLocation: 'Container'
      displayName: 'Publish AI Evaluation Scorecard'
      condition: always()

# ── STAGE 3: Build & Push Backend Docker Image ──────────────────────────────
- stage: BuildBackend
  displayName: '3. Build Backend Container'
  dependsOn: [DetectChanges, AIEvalQualityGate]
  condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['EvaluateDiff.setVars.backendChanged'], 'true'))
  jobs:
  - job: BuildDockerImage
    displayName: 'Build & Push Docker Image'
    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build Backend Docker Image'
      inputs:
        command: build
        dockerfilePath: 'app/bank-compliance/backend/Dockerfile'
        repository: 'bank-compliance-backend'
        tags: |
          $(Build.BuildId)
          latest

# ── STAGE 4: Deploy to AKS Cluster via Helm ─────────────────────────────────
- stage: DeployAKS
  displayName: '4. Deploy to AKS Cluster (Helm)'
  dependsOn: BuildBackend
  condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['EvaluateDiff.setVars.backendChanged'], 'true'))
  jobs:
  - deployment: DeployKubernetes
    displayName: 'Deploy via Helm Package'
    environment: 'bank-compliance-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Set AKS Context & Deploy via Helm'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksClusterName) --overwrite-existing
                
                OPENAI_ENDPOINT=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-endpoint --query value -o tsv)
                OPENAI_KEY=$(az keyvault secret show --vault-name kv-ht-ss-p-cin-01 --name openai-api-key --query value -o tsv)
                
                kubectl create namespace bank-compliance --dry-run=client -o yaml | kubectl apply -f -
                
                # Enforce 1-Replica FinOps Quota on System Addons
                kubectl scale deployment keda-admission-webhooks -n kube-system --replicas=1 2>/dev/null || true
                kubectl scale deployment keda-operator-metrics-apiserver -n kube-system --replicas=1 2>/dev/null || true
                kubectl scale deployment metrics-server -n kube-system --replicas=1 2>/dev/null || true
                kubectl scale deployment konnectivity-agent-autoscaler -n kube-system --replicas=1 2>/dev/null || true
                kubectl scale deployment coredns-autoscaler -n kube-system --replicas=1 2>/dev/null || true

                helm upgrade --install bank-compliance ./app/bank-compliance/chart \
                  --namespace bank-compliance \
                  --set backend.image.tag="$(Build.BuildId)" \
                  --set secrets.openaiEndpoint="$OPENAI_ENDPOINT" \
                  --set secrets.openaiKey="$OPENAI_KEY" \
                  --wait \
                  --timeout 5m

# ── STAGE 5: Build & Deploy Frontend to Static Web App ──────────────────────
- stage: DeployFrontend
  displayName: '5. Deploy Frontend SPA to Azure Static Web App'
  dependsOn: [DetectChanges, DevSecOpsScan]
  condition: and(succeeded(), eq(dependencies.DetectChanges.outputs['EvaluateDiff.setVars.frontendChanged'], 'true'))
  jobs:
  - deployment: DeployFrontendSPA
    displayName: 'Deploy React SPA to SWA'
    environment: 'bank-compliance-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: UseNode@1
            inputs:
              version: '22.x'
            displayName: 'Install Node.js 22.x'

          - script: |
              cd app/bank-compliance/frontend
              npm ci
              npm run build
            displayName: 'Build React Vite SPA'

          - task: AzureCLI@2
            displayName: 'Deploy SPA Build to Azure Static Web App'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                SWA_TOKEN=$(az staticwebapp secrets list --name $(staticWebAppName) --resource-group $(resourceGroup) --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=SWA_TOKEN;issecret=true]$SWA_TOKEN"
                npx @azure/static-web-apps-cli deploy ./app/bank-compliance/frontend/dist --deployment-token "$SWA_TOKEN" --env production
