# ==============================================================================
# Pipeline Name: BankCompliance AI - Application CI/CD Pipeline
# Description: DevSecOps scanning (SonarCloud, Bandit, pip-audit, npm audit),
#              Docker container build, AKS deployment & Static Web App deploy
# Stages: 0. DevSecOpsScan | 1. BuildBackend | 2. DeployAKS | 3. DeployFrontend
# Target Subscription: Apps-prod (f4ffefe1-d689-4059-969c-ccc73e2a11d4)
# ==============================================================================

name: BankCompliance-AI-App-Pipeline-$(Date:yyyyMMdd)$(Rev:.r)

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven CI.
trigger: none
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - app/bank-compliance/**
#       - pipelines/azure-cicd-app-bank-compliance.yml
#     exclude:
#       - '**/*.md'

# Disabled — GHA owns push/PR triggers. Uncomment to revert to ADO-driven PR checks.
pr: none
# pr:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     include:
#       - app/bank-compliance/**
#       - pipelines/azure-cicd-app-bank-compliance.yml
#     exclude:
#       - '**/*.md'

variables:
  - name: azureServiceConnection
    value: 'app-prod'
  - name: aksClusterName
    value: 'aks-ht-bankc-p-cin-01'
  - name: staticWebAppName
    value: 'stapp-ht-bankc-p-cin-01'
  - name: resourceGroup
    value: 'rg-ht-bankc-p-cin-01'
  - name: subscriptionId
    value: 'f4ffefe1-d689-4059-969c-ccc73e2a11d4'

pool:
  vmImage: ubuntu-latest

stages:

# ── STAGE 0: DevSecOps SAST & SCA Security Scanning ──────────────────────────
- stage: DevSecOpsScan
  displayName: '0. DevSecOps SAST & SCA Security Scan'
  jobs:
  - job: SecurityScan
    displayName: 'Execute SAST, Dependency SCA & SonarCloud Scan'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Use Python 3.11'

    - script: |
        echo "Installing DevSecOps security scanners (Bandit & pip-audit)..."
        pip install bandit pip-audit
        echo "Executing Bandit SAST code security scan on backend..."
        bandit -r app/bank-compliance/backend -ll -ii || echo "Bandit SAST scan completed with advisory notes."
        echo "Executing pip-audit dependency vulnerability scan..."
        pip-audit -r app/bank-compliance/backend/requirements.txt || echo "Dependency SCA scan completed."
      displayName: 'Python SAST & Dependency Vulnerability Scan (Bandit & pip-audit)'

    - task: UseNode@1
      inputs:
        version: '22.x'
      displayName: 'Install Node.js 22.x'

    - script: |
        cd app/bank-compliance/frontend
        echo "Executing npm audit for frontend package dependencies..."
        npm audit --audit-level=high || echo "Frontend npm audit completed with advisory notes."
      displayName: 'Frontend Dependency Vulnerability Scan (npm audit)'

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: 'SonarCloud'
        organization: 'repocodeganesh'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'RepoCodeGanesh_terraform-azure-iac'
        cliProjectName: 'terraform-azure-iac'
        cliSources: 'app/bank-compliance'
      displayName: 'Prepare Enterprise SonarCloud Analysis'

    - task: SonarCloudAnalyze@4
      displayName: 'Execute Enterprise SonarCloud SAST Security Scan'

# ── STAGE 1: Build & Push Backend Docker Image ──────────────────────────────
- stage: BuildBackend
  displayName: '1. Build Backend Container'
  dependsOn: DevSecOpsScan
  jobs:
  - job: BuildDockerImage
    displayName: 'Build & Push Docker Image'
    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build Backend Docker Image'
      inputs:
        command: build
        dockerfilePath: 'app/bank-compliance/backend/Dockerfile'
        repository: 'bank-compliance-backend'
        tags: |
          $(Build.BuildId)
          latest

# ── STAGE 2: Deploy to AKS Cluster ──────────────────────────────────────────
- stage: DeployAKS
  displayName: '2. Deploy to AKS Cluster'
  dependsOn: BuildBackend
  jobs:
  - deployment: DeployKubernetes
    displayName: 'Deploy Kubernetes Manifests'
    environment: 'bank-compliance-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Set AKS Context & Deploy Manifests'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksClusterName) --overwrite-existing
                kubectl apply -f app/bank-compliance/k8s/namespace.yaml
                kubectl apply -f app/bank-compliance/k8s/serviceaccount.yaml
                kubectl apply -f app/bank-compliance/k8s/backend-configmap.yaml
                OPENAI_KEY=$(az cognitiveservices account keys list --name oai-ht-taxb-p-eus-01 --resource-group rg-ht-taxb-p-cin-01 --query "key1" -o tsv)
                kubectl create secret generic litellm-secret --from-literal=AZURE_API_KEY="$OPENAI_KEY" -n bank-compliance --dry-run=client -o yaml | kubectl apply -f -
                kubectl create configmap litellm-config --from-file=config.yaml=app/bank-compliance/k8s/litellm/config.yaml -n bank-compliance --dry-run=client -o yaml | kubectl apply -f -
                kubectl apply -f app/bank-compliance/k8s/litellm/deployment.yaml
                kubectl apply -f app/bank-compliance/k8s/backend-deployment.yaml

# ── STAGE 3: Build & Deploy Frontend to Static Web App ──────────────────────
- stage: DeployFrontend
  displayName: '3. Deploy Frontend SPA to Azure Static Web App'
  dependsOn: DevSecOpsScan
  jobs:
  - deployment: DeployFrontendSPA
    displayName: 'Deploy React SPA to SWA'
    environment: 'bank-compliance-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: UseNode@1
            inputs:
              version: '22.x'
            displayName: 'Install Node.js 22.x'

          - script: |
              cd app/bank-compliance/frontend
              npm ci
              npm run build
            displayName: 'Build React Vite SPA'

          - task: AzureCLI@2
            displayName: 'Deploy SPA Build to Azure Static Web App'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                SWA_TOKEN=$(az staticwebapp secrets list --name $(staticWebAppName) --resource-group $(resourceGroup) --query "properties.apiKey" -o tsv)
                echo "##vso[task.setvariable variable=SWA_TOKEN;issecret=true]$SWA_TOKEN"
                npx @azure/static-web-apps-cli deploy ./app/bank-compliance/frontend/dist --deployment-token "$SWA_TOKEN" --env production
